<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영어 수업 학습 일지</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap');

    :root {
      --ej-font-display: 'IBM Plex Sans KR', sans-serif;
      --ej-font-body: 'IBM Plex Sans KR', sans-serif;
      --ej-desk: #DCD0B4;
      --ej-paper: #FBF8EF;
      --ej-paper-card: #FDFAF0;
      --ej-line: #E3D9BF;
      --ej-margin-line: rgba(176, 74, 74, .32);
      --ej-ink: #262A45;
      --ej-ink-soft: #6B6F8A;
      --ej-sage: #2F6F4F;
      --ej-sage-dark: #204F38;
      --ej-gold: #C98A2E;
      --ej-gold-bg: #FBEBCF;
      --ej-plum: #6B4C6B;
      --ej-plum-bg: #F1E6EE;
      --ej-danger: #B04A3F;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--ej-desk);
      background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,.25), transparent 45%);
      color: var(--ej-ink);
      font-family: var(--ej-font-body);
      min-height: 100vh;
    }
    body { zoom: 1.1; }
    @media (max-width: 640px) { body { zoom: 1; } }
    #app-wrap { display: flex; justify-content: center; padding: 28px 14px 50px; }
    #app {
      position: relative;
      width: 100%; max-width: 1180px;
      padding: 46px 40px 60px 76px;
      background-color: var(--ej-paper);
      background-image: repeating-linear-gradient(to bottom, transparent, transparent 30px, var(--ej-line) 31px);
      background-position: 0 46px;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(38,42,69,.20), 0 4px 10px rgba(38,42,69,.10);
      overflow: hidden;
    }
    #app::before {
      content: "";
      position: absolute; top: 0; bottom: 0; left: 46px; width: 2px;
      background: var(--ej-margin-line);
      pointer-events: none;
    }
    #app::after {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; height: 22px;
      background-image: radial-gradient(circle, var(--ej-desk) 34%, var(--ej-paper) 38%, var(--ej-paper) 60%, transparent 62%);
      background-size: 30px 30px;
      background-position: 15px -14px;
      background-repeat: repeat-x;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      #app { padding: 40px 18px 50px 34px; }
      #app::before { left: 20px; }
      #app::after { background-size: 22px 22px; background-position: 11px -10px; }
    }
    .ej-intro-line { white-space: nowrap; }
    @media (max-width: 480px) {
      .ej-intro-line { white-space: normal; }
    }

    .ej-eyebrow {
      font-family: var(--ej-font-body);
      letter-spacing: 0.06em; text-transform: uppercase;
      font-size:13px; color: var(--ej-ink-soft);
    }
    .ej-serif { font-family: var(--ej-font-display); }

    .ej-btn {
      font-family: var(--ej-font-body);
      font-weight: 700; border: none; cursor: pointer;
      border-radius: 10px;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .ej-btn:active { transform: translateY(1px); }
    .ej-btn:focus-visible, .ej-input:focus-visible, .ej-textarea:focus-visible, .ej-card-btn:focus-visible {
      outline: 3px solid var(--ej-gold); outline-offset: 2px;
    }
    .ej-btn-primary {
      background: var(--ej-sage); color: #FBF8EE;
      padding: 13px 22px; box-shadow: 0 3px 0 var(--ej-sage-dark);
    }
    .ej-btn-primary:hover { background: var(--ej-sage-dark); }
    .ej-btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .ej-btn-ghost {
      background: var(--ej-paper-card); color: var(--ej-ink-soft);
      padding: 9px 14px; display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--ej-line); border-radius: 10px;
    }
    .ej-btn-ghost:hover { color: var(--ej-ink); background: var(--ej-line); }
    .ej-btn-gold {
      background: var(--ej-gold-bg); color: var(--ej-gold);
      padding: 9px 14px; display: inline-flex; align-items: center; gap: 6px; border-radius: 8px;
    }
    .ej-tab-row { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid var(--ej-line); }
    .ej-tab-btn {
      padding: 12px 20px; font-size:13.5px; font-weight: 700; background: none; border: none;
      cursor: pointer; color: var(--ej-ink-soft); border-bottom: 3px solid transparent; margin-bottom: -2px;
      font-family: var(--ej-font-body);
    }
    .ej-tab-btn.active { color: var(--ej-sage); border-bottom-color: var(--ej-sage); }
    .ej-tab-btn:hover { color: var(--ej-ink); }
    .ej-teacher-shell { display: grid; grid-template-columns: 196px 1fr; gap: 24px; align-items: start; }
    @media (max-width: 720px) {
      .ej-teacher-shell { grid-template-columns: 1fr; }
      .ej-teacher-sidenav { flex-direction: row !important; overflow-x: auto; gap: 6px !important; }
      .ej-sidenav-btn { white-space: nowrap; }
    }
    .ej-teacher-sidenav {
      display: flex; flex-direction: column; gap: 3px;
      background: var(--ej-paper-card); border: 1px solid var(--ej-line); border-radius: 12px;
      padding: 10px; position: sticky; top: 20px;
    }
    .ej-sidenav-btn {
      text-align: left; padding: 11px 14px; border-radius: 8px; background: none; border: none;
      cursor: pointer; font-weight: 700; font-size:12px; color: var(--ej-ink-soft);
      display: flex; align-items: center; gap: 8px; font-family: var(--ej-font-body);
    }
    .ej-sidenav-btn.active { background: var(--ej-sage); color: #FBF8EE; }
    .ej-sidenav-btn:hover:not(.active) { background: var(--ej-line); color: var(--ej-ink); }
    .ej-sidenav-divider { height: 1px; background: var(--ej-line); margin: 6px 4px; }
    .ej-rank-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap;
    }
    .ej-rank-row + .ej-rank-row { border-top: 1px solid var(--ej-line); }
    .ej-rank-number { font-family: var(--ej-font-body); font-weight: 700; font-size:12px; min-width: 32px; color: var(--ej-ink-soft); text-align: center; }

    .ej-input, .ej-textarea {
      font-family: var(--ej-font-body);
      background: #FFFEF8; border: 1.5px solid var(--ej-line); border-radius: 8px;
      padding: 11px 13px; font-size:12px; color: var(--ej-ink); width: 100%;
    }
    .ej-textarea {
      resize: vertical; line-height: 1.65;
      background-image: repeating-linear-gradient(to bottom, transparent, transparent 30px, var(--ej-line) 31px);
    }
    .ej-field { margin-bottom: 14px; }
    .ej-field-label { font-size:15px; font-weight: 700; color: var(--ej-ink-soft); margin-bottom: 6px; }

    .ej-card {
      background-color: var(--ej-paper-card);
      border: 1px solid var(--ej-line);
      border-radius: 14px; box-shadow: 0 1px 2px rgba(120,100,60,.05);
      position: relative; overflow: hidden;
    }
    .ej-card-btn { cursor: pointer; text-align: left; width: 100%; }
    .ej-card-btn:hover { box-shadow: 0 6px 16px rgba(120,100,60,.14); }
    .ej-spine {
      position: absolute; left: 0; top: 0; bottom: 0; width: 26px;
      background: repeating-linear-gradient(to bottom, var(--ej-line) 0, var(--ej-line) 2px, transparent 2px, transparent 22px);
    }
    .ej-indent { margin-left: 16px; }

    .ej-login-panel {
      padding: 0;
    }
    .ej-postit {
      background: #FBF7E8;
      background-image: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,0) 40%);
      padding: 30px 24px 26px;
      border-radius: 3px 3px 3px 34px / 3px 3px 3px 20px;
      box-shadow: 5px 8px 0 rgba(0,0,0,.04), 6px 10px 18px rgba(90,70,10,.14);
      position: relative;
    }
    .ej-postit::before {
      content: "";
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(-2deg);
      width: 90px; height: 26px;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: 0 2px 4px rgba(38,42,69,.08);
    }
    .ej-postit::after {
      content: "";
      position: absolute; bottom: 0; right: 0;
      width: 0; height: 0;
      border-style: solid; border-width: 0 0 20px 20px;
      border-color: transparent transparent rgba(0,0,0,.06) transparent;
    }
    .ej-postit .ej-field-label { color: #8A7A46; }
    .ej-postit .ej-input { border-color: rgba(122,106,31,.2); }

    .ej-stamp {
      font-family: var(--ej-font-body); font-weight: 700;
      display: inline-flex; align-items: center; gap: 5px;
      border: 2px solid var(--ej-gold); color: var(--ej-gold);
      border-radius: 999px; padding: 4px 12px; font-size:15px;
      transform: rotate(-3deg); background: var(--ej-gold-bg);
    }
    .ej-badge {
      display: inline-flex; align-items: center; gap: 6px;
      border-radius: 999px; padding: 5px 12px 5px 9px; font-size:14.5px; font-weight: 700;
    }
    .ej-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
    }
    .ej-empty {
      padding: 30px 20px; text-align: center; color: var(--ej-ink-soft); font-size:14px;
    }
    .ej-error {
      background: #F7E3DF; color: var(--ej-danger); padding: 10px 14px; border-radius: 8px;
      font-size:12px; margin-bottom: 14px;
    }
    .ej-error::before { content: "⚠️ "; }
    .ej-feedback-note {
      margin-top: 14px; background: var(--ej-plum-bg); border-left: 4px solid var(--ej-plum);
      border-radius: 4px 10px 10px 4px; padding: 12px 14px;
    }
    .ej-letter-card {
      background: linear-gradient(180deg, #FFFEF9, var(--ej-paper-card) 40%);
      border: 1px solid var(--ej-line); border-radius: 3px;
      box-shadow: 0 5px 16px rgba(120,100,60,.14), 0 1px 0 rgba(255,255,255,.7) inset;
      position: relative; padding: 32px 26px 22px; margin-top: 20px;
    }
    .ej-letter-seal {
      display: flex; align-items: center; justify-content: center; width: 42px; height: 42px;
      border-radius: 50%; font-size:15px; flex-shrink: 0; color: #FBF3E6;
      background: radial-gradient(circle at 35% 30%, #8a5d8a, var(--ej-plum) 72%);
      box-shadow: 0 3px 6px rgba(38,20,38,.3), inset 0 -2px 3px rgba(0,0,0,.25), inset 0 2px 2px rgba(255,255,255,.3);
      border: 2px solid var(--ej-paper-card);
      margin-top: -46px;
    }
    .ej-letter-divider {
      width: 54px; height: 1px; background: var(--ej-gold); opacity: .55; margin: 6px auto 2px;
    }
    .ej-letter-seal-inline {
      margin-top: 0; width: 34px; height: 34px; font-size:12px;
    }
    .ej-reply-note {
      margin-top: 12px; background: var(--ej-gold-bg); border-left: 4px solid var(--ej-gold);
      border-radius: 4px 10px 10px 4px; padding: 12px 14px;
    }
    .ej-mail-badge {
      display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px;
      padding: 0 6px; border-radius: 999px; background: var(--ej-danger); color: #fff;
      font-size:12px; font-weight: 700; margin-left: 4px;
    }
    .ej-star-row { display: flex; align-items: center; gap: 2px; }
    .ej-star-btn { background: none; border: none; cursor: pointer; padding: 2px; font-size:20px; color: var(--ej-gold); line-height: 1; }
    .ej-loading { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 120px 0; color: var(--ej-ink-soft); }
    .ej-spin { animation: ej-spin 1s linear infinite; font-size:22px; }
    @keyframes ej-spin { to { transform: rotate(360deg); } }

    .ej-level-wrap { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding: 6px 2px 2px; }
    .ej-level-node { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 62px; flex-shrink: 0; }
    .ej-level-circle {
      width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size:21px; border: 3px solid transparent; transition: transform .15s ease;
    }
    .ej-level-circle.current { transform: scale(1.18); box-shadow: 0 4px 10px rgba(38,42,69,.16); }
    .ej-level-circle.locked { filter: grayscale(1); opacity: .45; }
    .ej-level-label { font-size:13.5px; font-weight: 700; color: var(--ej-ink); }
    .ej-level-threshold { font-family: var(--ej-font-body); font-size:12px; color: var(--ej-ink-soft); }
    .ej-level-current-tag { font-size:12px; color: var(--ej-sage); font-weight: 700; }
    .ej-level-segment { flex: 1; height: 4px; background: var(--ej-line); border-radius: 2px; margin: 21px 6px 0; min-width: 18px; position: relative; }
    .ej-level-segment-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ej-sage); border-radius: 2px; }

    .ej-notify-chip {
      display: inline-flex; align-items: center; gap: 6px; background: var(--ej-plum-bg); color: var(--ej-plum);
      border-radius: 999px; padding: 5px 12px; font-size:14.5px; font-weight: 700;
    }
    .ej-blink { animation: ej-blink 1.1s ease-in-out infinite; }
    @keyframes ej-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .ej-blink { animation: none; } }

    .ej-celebrate-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(38,42,69,.45);
      display: flex; align-items: center; justify-content: center;
      animation: ej-celebrate-fade-in .25s ease-out;
      font-family: var(--ej-font-body);
    }
    .ej-celebrate-overlay.ej-celebrate-hide { animation: ej-celebrate-fade-out .3s ease-in forwards; }
    @keyframes ej-celebrate-fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes ej-celebrate-fade-out { from { opacity: 1; } to { opacity: 0; } }
    .ej-celebrate-confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .ej-confetti-piece {
      position: absolute; top: -10%; font-size:22px;
      animation-name: ej-confetti-fall; animation-timing-function: ease-in; animation-iteration-count: 1;
      animation-fill-mode: forwards;
    }
    @keyframes ej-confetti-fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(340deg); opacity: 0; }
    }
    .ej-celebrate-card {
      position: relative; background: var(--ej-paper-card); border-radius: 18px;
      padding: 34px 30px 28px; max-width: 300px; width: 90%; text-align: center;
      box-shadow: 0 20px 50px rgba(38,42,69,.35);
      animation: ej-celebrate-pop .45s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes ej-celebrate-pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .ej-celebrate-badge {
      width: 92px; height: 92px; border-radius: 50%; border: 4px solid;
      display: flex; align-items: center; justify-content: center; font-size:46px;
      margin: 0 auto 14px; box-shadow: 0 6px 16px rgba(38,42,69,.15);
    }
    .ej-celebrate-title { font-size:15px; font-weight: 700; color: var(--ej-ink-soft); margin-bottom: 4px; }
    .ej-celebrate-tier { font-family: var(--ej-font-display); font-size:24px; font-weight: 700; margin-bottom: 8px; }
    .ej-celebrate-sub { font-size:15px; color: var(--ej-ink-soft); margin-bottom: 20px; }
    @media (prefers-reduced-motion: reduce) {
      .ej-celebrate-overlay, .ej-celebrate-card, .ej-confetti-piece { animation: none !important; }
      .ej-celebrate-confetti { display: none; }
    }

    .ej-mail-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(38,42,69,.45);
      display: flex; align-items: center; justify-content: center;
      animation: ej-celebrate-fade-in .2s ease-out;
      font-family: var(--ej-font-body);
      padding: 24px 16px;
    }
    .ej-mail-overlay.ej-mail-hide { animation: ej-celebrate-fade-out .25s ease-in forwards; }
    .ej-mail-modal {
      position: relative; background: var(--ej-paper-card); border-radius: 10px;
      max-width: 620px; width: 100%; max-height: 85vh; overflow-y: auto;
      padding: 30px 26px 26px; box-shadow: 0 20px 50px rgba(38,42,69,.35);
      animation: ej-mail-unfold .45s cubic-bezier(.22,1.2,.4,1);
      transform-origin: top center;
    }
    .ej-mail-modal::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: repeating-linear-gradient(45deg, var(--ej-plum) 0 10px, var(--ej-gold) 10px 20px);
      opacity: .55;
    }
    @keyframes ej-mail-unfold {
      0% { transform: scaleY(.1) scaleX(.9); opacity: 0; }
      55% { transform: scaleY(1.04) scaleX(1); opacity: 1; }
      100% { transform: scaleY(1) scaleX(1); }
    }
    .ej-mail-modal-close {
      position: absolute; top: 14px; right: 16px; background: none; border: none;
      font-size:15px; cursor: pointer; color: var(--ej-ink-soft); line-height: 1; padding: 4px;
    }
    .ej-mail-modal-close:hover { color: var(--ej-ink); }
    @media (prefers-reduced-motion: reduce) {
      .ej-mail-overlay, .ej-mail-modal { animation: none !important; }
    }

    .ej-summary-row {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 16px;
      background: none; border: none; cursor: pointer; text-align: left; font-family: inherit; color: inherit;
    }
    .ej-summary-row:hover { background: rgba(47,111,79,0.05); }
    .ej-summary-date { font-family: var(--ej-font-body); font-size:14.5px; color: var(--ej-ink-soft); min-width: 84px; flex-shrink: 0; }
    .ej-summary-snippet { flex: 1; font-size:12px; color: var(--ej-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ej-summary-chevron { color: var(--ej-ink-soft); font-size:14px; flex-shrink: 0; }

    .ej-home-grid { display: grid; grid-template-columns: minmax(200px, 1fr) 2fr; gap: 18px; align-items: start; }
    @media (max-width: 640px) { .ej-home-grid { grid-template-columns: 1fr; } }

    .ej-profile-card { padding: 26px 18px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .ej-profile-circle {
      width: 108px; height: 108px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size:56px; border: 4px solid; box-shadow: 0 6px 16px rgba(38,42,69,.12); margin-bottom: 12px;
    }
    .ej-profile-tier { font-size:14px; font-weight: 700; }
    .ej-profile-tier-tag { font-size:13px; color: var(--ej-ink-soft); margin-bottom: 14px; }
    .ej-profile-points { font-size:32px; font-weight: 700; color: var(--ej-ink); line-height: 1; }
    .ej-profile-points-label { font-size:13.5px; color: var(--ej-ink-soft); letter-spacing: .06em; margin: 4px 0 14px; }
    .ej-profile-bar-track { width: 100%; height: 8px; background: var(--ej-line); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
    .ej-profile-bar-fill { height: 100%; background: var(--ej-sage); border-radius: 999px; }
    .ej-profile-next { font-size:14px; color: var(--ej-ink-soft); }
    .ej-streak-chip {
      margin-top: 10px; display: inline-flex; align-items: center; gap: 5px;
      background: #FDEDE1; color: #C1622C; font-weight: 700; font-size:14px;
      padding: 5px 11px; border-radius: 999px;
    }
    .ej-mini-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size:15px; }
    .ej-mini-stat-row + .ej-mini-stat-row { border-top: 1px dashed var(--ej-line); }
    .ej-mini-stat-label { color: var(--ej-ink-soft); font-weight: 700; }
    .ej-mini-stat-value { color: var(--ej-ink); font-weight: 700; }
    .ej-calendar-card { padding: 16px 18px 18px; margin-top: 12px; }
    .ej-calendar-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .ej-calendar-nav { display:flex; gap:4px; }
    .ej-calendar-nav button { width:30px; height:30px; border:1px solid var(--ej-line); border-radius:8px; background:var(--ej-paper); color:var(--ej-ink-soft); cursor:pointer; font-weight:700; }
    .ej-calendar-nav button:hover { background:var(--ej-line); color:var(--ej-ink); }
    .ej-calendar-title { font-size:15px; font-weight:700; }
    .ej-calendar-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:3px; }
    .ej-calendar-weekday { text-align:center; font-size:12px; font-weight:700; color:var(--ej-ink-soft); padding:3px 0 5px; }
    .ej-calendar-day { min-height:34px; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--ej-ink); cursor:pointer; font-family:inherit; font-size:12px; }
    .ej-calendar-day:hover { background:var(--ej-line); }
    .ej-calendar-day.empty { cursor:default; }
    .ej-calendar-day.empty:hover { background:transparent; }
    .ej-calendar-day.today { border-color:var(--ej-gold); }
    .ej-calendar-day.done { background:var(--ej-sage); color:#fff; font-weight:700; }
    .ej-calendar-day.selected { box-shadow:0 0 0 2px var(--ej-plum) inset; }
    .ej-calendar-day.done.today { border-color:var(--ej-gold); }
    .ej-calendar-meta { margin-top:10px; padding-top:9px; border-top:1px dashed var(--ej-line); font-size:12px; color:var(--ej-ink-soft); line-height:1.55; }
    .ej-calendar-selected { margin-top:8px; padding:9px 11px; border-left:4px solid var(--ej-gold); background:var(--ej-gold-bg); border-radius:4px 9px 9px 4px; }

    .ej-word-card { padding:16px 18px; margin-top:12px; }
    .ej-word-count { font-size:25px; font-weight:700; line-height:1; }
    .ej-word-grid { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; margin-top:10px; }
    .ej-word-chip { min-width:0; padding:9px 10px; border:1px solid var(--ej-line); border-radius:10px; background:var(--ej-paper); }
    .ej-word-chip-word { font-weight:700; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ej-word-chip-meaning { margin-top:2px; font-size:12px; color:var(--ej-ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ej-word-overlay { position:fixed; inset:0; z-index:9999; background:rgba(38,42,69,.45); display:flex; align-items:center; justify-content:center; padding:20px 14px; font-family:var(--ej-font-body); }
    .ej-word-modal { position:relative; width:min(680px, 100%); max-height:88vh; overflow:auto; background:var(--ej-paper-card); border-radius:14px; padding:26px 22px 24px; box-shadow:0 20px 50px rgba(38,42,69,.35); }
    .ej-word-modal::before { content:""; position:absolute; left:0; right:0; top:0; height:6px; background:repeating-linear-gradient(45deg, var(--ej-sage) 0 10px, var(--ej-gold) 10px 20px); opacity:.6; border-radius:14px 14px 0 0; }
    .ej-word-close { position:absolute; top:12px; right:14px; border:none; background:none; color:var(--ej-ink-soft); font-size:17px; cursor:pointer; }
    .ej-word-close:hover { color:var(--ej-ink); }
    .ej-wg-still, .ej-wg-still .ej-mail-modal { animation: none !important; }
    .ej-wg-item { transition: none; }
    .ej-wg-item{position:relative;display:flex;align-items:center;gap:8px;min-height:48px;padding:10px 12px;border:2px solid var(--ej-line,#d9d2c3);border-radius:12px;background:#fff;font:inherit;font-size:15px;font-weight:600;text-align:left;cursor:pointer;color:inherit}
    .ej-wg-badge{flex:none;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;color:#fff;font-size:12px;font-weight:700}
    .ej-dict-chips{display:flex;flex-wrap:wrap;gap:6px}
    .ej-dict-chip{background:var(--ej-paper,#fff);border:1.5px solid var(--ej-line,#d9d2c3);border-radius:999px;padding:4px 12px;font-size:13px}
    .ej-word-row { display:flex; gap:8px; align-items:flex-start; padding:12px 0; border-top:1px dashed var(--ej-line); }
    .ej-word-row:first-child { border-top:none; }
    .ej-word-main { flex:1; min-width:0; }
    .ej-word-row-word { font-weight:700; font-size:14px; }
    .ej-word-row-example { margin-top:7px; font-size:12px; line-height:1.55; color:var(--ej-ink); }
    .ej-word-delete { border:none; background:var(--ej-paper); color:var(--ej-danger); border:1px solid var(--ej-line); border-radius:8px; padding:6px 8px; cursor:pointer; font-family:inherit; }
    @media (max-width: 640px) { .ej-word-grid { grid-template-columns:1fr 1fr; } .ej-calendar-day { min-height:31px; font-size:12px; } }
    @media (prefers-reduced-motion: reduce) { .ej-btn, .ej-card-btn { transition: none !important; } .ej-spin { animation: none; } .ej-level-circle { transition: none !important; } }

    /* =====================================================================
       🎮 게임 테마 (기존 노트 디자인을 덮어써요)
       ===================================================================== */
    :root {
      --ej-font-display: 'IBM Plex Sans KR', sans-serif;
      --ej-desk: #9FD6F2; --ej-paper: #FFF8EC; --ej-paper-card: #FFFDF7; --ej-line: #EBDDC3;
      --ej-ink: #3B2F2A; --ej-ink-soft: #85735F; --ej-sage: #5DAF4C; --ej-sage-dark: #3F8A33;
      --ej-gold: #E6A532; --ej-gold-bg: #FFF0CC; --ej-plum: #8E6BC4; --ej-plum-bg: #F1EAFB; --ej-danger: #E05A4F;
      --g-wood: #C98F55; --g-wood-d: #8E5E33; --g-cream: #FFFBF2; --g-shadow: 0 6px 0 rgba(90,60,30,.18), 0 14px 30px rgba(40,40,70,.18);
    }
    html, body { background: #9FD6F2 !important; background-image: none !important; }
    body { zoom: 1 !important; overflow-x: hidden; }
    body[data-screen="home"] { overflow: hidden; }
    #app-wrap { position: relative; z-index: 5; padding: 0; display: block; min-height: 100vh; }
    #app { max-width: none; padding: 0; background: none !important; box-shadow: none; border-radius: 0; overflow: visible; }
    #app::before, #app::after { display: none !important; }
    .ej-textarea { background-image: none !important; }
    .ej-serif, h1, h2, h3 { font-family: var(--ej-font-display); font-weight: 700 !important; letter-spacing: 0; }
    .ej-btn { font-family: var(--ej-font-display); font-weight: 700; letter-spacing: 0; border-radius: 14px; }
    .ej-btn-primary { background: #5DAF4C; box-shadow: 0 4px 0 #3F8A33; font-size: 15px; }
    .ej-btn-primary:hover { background: #67BB55; }
    .ej-btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #3F8A33; }
    .ej-btn-ghost { background: #FFFDF7; border: 2px solid #EBDDC3; box-shadow: 0 3px 0 #EBDDC3; color: #6E5D4C; }
    .ej-btn-ghost:hover { background: #FFF6E4; color: #3B2F2A; }
    .ej-btn-gold { background: #FFE7A8; color: #8A5A10; box-shadow: 0 3px 0 #E6C273; }
    .ej-card { border: 2px solid #EBDDC3; border-radius: 16px; background: #FFFDF7; box-shadow: 0 3px 0 #EBDDC3; }
    .ej-input, .ej-textarea { border: 2px solid #EBDDC3; border-radius: 12px; font-size: 14px; background: #fff; }
    .ej-input:focus, .ej-textarea:focus { outline: none; border-color: #8CCB79; box-shadow: 0 0 0 3px rgba(140,203,121,.25); }
    .ej-field-label { font-family: var(--ej-font-display); font-weight: 700; color: #8A6A45; font-size: 15px; }
    .ej-eyebrow { font-family: var(--ej-font-display); letter-spacing: .04em; color: #A0866A; }
    .ej-stamp { transform: none; }
    .ej-postit { background: transparent; padding: 0; border-radius: 0; box-shadow: none; }
    .ej-postit::before, .ej-postit::after { display: none; }
    .ej-tab-btn.active { color: #3F8A33; border-bottom-color: #5DAF4C; }
    .ej-sidenav-btn.active { background: #5DAF4C; }
    .ej-teacher-sidenav { border: 2px solid #EBDDC3; border-radius: 16px; background: #FFFDF7; }

    /* 팝업(우편함·사전·단어장·게임 등)을 게임 창처럼 */
    .ej-mail-overlay, .ej-word-overlay, .ej-celebrate-overlay { background: rgba(30,40,70,.32) !important; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .ej-mail-modal, .ej-word-modal {
      background: var(--g-cream) !important; border-radius: 24px !important; border: 4px solid #E3C48E;
      box-shadow: 0 8px 0 #C9A26A, 0 24px 50px rgba(30,30,60,.35) !important;
    }
    .ej-mail-modal::before, .ej-word-modal::before { display: none !important; }
    .ej-mail-modal-close, .ej-word-close { width: 36px; height: 36px; border-radius: 50% !important; background: #FFF0D6 !important; border: 2px solid #E3C48E !important; color: #8E5E33 !important; font-size: 16px !important; display: flex; align-items: center; justify-content: center; }
    .ej-celebrate-card { border-radius: 24px; border: 4px solid #E3C48E; background: var(--g-cream); }

    /* ---------- 3D 월드 레이어 ---------- */
    #world { position: fixed; inset: 0; z-index: 0; transition: filter .8s ease, transform .8s ease;
      background: linear-gradient(#8FD0F2 0%, #C6E9F8 55%, #EAF7F4 100%); }
    #world[data-tod="morning"] { background: linear-gradient(#FFC9A8 0%, #FDE7CF 45%, #D9F0EE 100%); }
    #world[data-tod="evening"] { background: linear-gradient(#F28D6F 0%, #F9C08A 45%, #F6DDB0 100%); }
    #world[data-tod="night"] { background: linear-gradient(#141B3A 0%, #2A3466 60%, #46518A 100%); }
    #world canvas { display: block; touch-action: none; }
    body:not([data-screen="home"]) #world { filter: blur(7px) saturate(1.15) brightness(.97); transform: scale(1.04); }
    body[data-screen="teacher"] #world { filter: blur(12px) saturate(1.1) brightness(.9); }
    #world.w-fallback::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -30vh; height: 70vh; border-radius: 50%;
      background: radial-gradient(ellipse at 50% 20%, #9FDB80, #6FB556 70%); box-shadow: 0 -10px 0 #B7E39C; }
    #world-labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
    body:not([data-screen="home"]) #world-labels, body:not([data-screen="home"]) #world-bubble { display: none; }
    .w-label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 11px 5px 8px; border-radius: 999px; border: 2px solid rgba(255,255,255,.9); background: rgba(255,251,242,.92);
      color: #4A3A2C; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 13.5px; white-space: nowrap; box-shadow: 0 3px 0 rgba(90,60,30,.15), 0 6px 14px rgba(40,40,70,.15);
      transition: background .15s, box-shadow .15s; will-change: transform; }
    .w-label::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -6px; border: 6px solid transparent; border-top-color: rgba(255,251,242,.92); border-bottom: 0; }
    .w-label:hover, .w-label.hover { background: #FFF2C8; box-shadow: 0 3px 0 rgba(90,60,30,.2), 0 0 0 4px rgba(255,214,90,.45); }
    .w-label-emoji { font-size: 15px; }
    .w-label-badge { display: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #E05A4F; color: #fff; font-size: 12px; line-height: 20px; text-align: center; margin-left: 2px; animation: w-pop 1.6s ease-in-out infinite; }
    @keyframes w-pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @media (max-width: 720px) { .w-label { font-size: 12px; padding: 4px 9px 4px 6px; } .w-label-text { display: none; } .w-label.has-badge .w-label-text, .w-label.hover .w-label-text { display: inline; } }
    .w-bubble { position: fixed; left: 0; top: 0; z-index: 3; max-width: 230px; padding: 9px 14px; border-radius: 16px; background: #FFFDF6; border: 3px solid #EADFC6;
      color: #4A3F35; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 15px; line-height: 1.4; text-align: center; pointer-events: none;
      box-shadow: 0 4px 0 rgba(90,60,30,.12); opacity: 0; transition: opacity .2s; }
    .w-bubble.show { opacity: 1; }
    .w-bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -8px; border: 8px solid transparent; border-top-color: #FFFDF6; border-bottom: 0; }
    .w-heart { position: absolute; font-size: 20px; pointer-events: none; animation: w-heart 1.2s ease-out forwards; }
    @keyframes w-heart { 0% { opacity: 0; transform: translate(-50%,0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx,0px)),-60px) scale(1.2); } }
    #world-flash { position: fixed; inset: 0; z-index: 9000; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
    #world-flash.on { opacity: .92; }

    /* ---------- 로그인 / 로딩 ---------- */
    .g-center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 14px; }
    .g-login { width: min(430px, 100%); background: rgba(255,251,242,.9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 4px solid #fff; border-radius: 28px; padding: 26px 24px 22px; box-shadow: var(--g-shadow); text-align: center; position: relative; }
    .g-login-badge { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); background: #5DAF4C; color: #fff; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700;
      padding: 7px 18px; border-radius: 999px; font-size: 14px; letter-spacing: .08em; box-shadow: 0 4px 0 #3F8A33; white-space: nowrap; }
    .g-title { font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 36px; color: #3B2F2A; margin: 10px 0 0; line-height: 1.15; }
    .g-title-sub { font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; color: #8A6A45; font-size: 17px; margin: 6px 0 16px; }
    .g-login .ej-field { text-align: left; }
    .g-login .ej-field-label { text-align: center; }
    .g-login .ej-input { text-align: center; font-size: 16px; padding: 10px; }
    .g-help { margin: 6px 0 12px; background: #EAF6E2; color: #3F7A33; padding: 9px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.55; text-align: left; }
    .g-start { width: 100%; font-size: 19px !important; padding: 14px !important; }
    .g-start:not(:disabled) { animation: g-glow 2.2s ease-in-out infinite; }
    @keyframes g-glow { 0%,100% { box-shadow: 0 4px 0 #3F8A33; } 50% { box-shadow: 0 4px 0 #3F8A33, 0 0 0 6px rgba(93,175,76,.25); } }
    .g-teacher-link { margin-top: 14px; background: rgba(255,251,242,.85); border: 2px solid #fff; border-radius: 999px; padding: 8px 16px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; color: #6E5D4C; cursor: pointer; font-size: 14px; box-shadow: 0 3px 0 rgba(90,60,30,.12); }
    .g-teacher-link:hover { background: #fff; }
    .g-loading { text-align: center; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(30,40,70,.35); font-size: 20px; }
    .g-loading-bar { width: 220px; height: 14px; border-radius: 999px; background: rgba(255,255,255,.5); border: 3px solid #fff; margin: 14px auto 0; overflow: hidden; }
    .g-loading-bar::after { content: ""; display: block; width: 40%; height: 100%; background: #5DAF4C; border-radius: 999px; animation: g-load 1.1s ease-in-out infinite; }
    @keyframes g-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }

    /* ---------- 학생 홈 HUD ---------- */
    body[data-screen="home"] #app-wrap { position: fixed; inset: 0; pointer-events: none; min-height: 0; }
    .ui { pointer-events: auto; }
    .g-player { position: fixed; top: 14px; left: 14px; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 9px;
      background: rgba(255,251,242,.94); border: 3px solid #fff; border-radius: 22px; box-shadow: var(--g-shadow); cursor: pointer; max-width: calc(100vw - 28px); }
    .g-player:hover { background: #fff; }
    .g-avatar { width: 54px; height: 54px; border-radius: 16px; background: linear-gradient(#DDF1F8, #BFE6A8); display: flex; align-items: center; justify-content: center; font-size: 32px; border: 3px solid #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.08); flex-shrink: 0; }
    .g-player-main { min-width: 0; }
    .g-player-name { font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 18px; color: #3B2F2A; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .g-lv { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; color: #fff; }
    .g-player-sub { font-size: 12px; color: #8A7660; margin: 1px 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .g-xp { position: relative; width: 210px; max-width: 46vw; height: 18px; border-radius: 999px; background: #EFE3CC; overflow: hidden; border: 2px solid #fff; box-shadow: inset 0 2px 0 rgba(0,0,0,.06); }
    .g-xp-fill { height: 100%; border-radius: 999px; background: linear-gradient(#8FDB6E, #5DAF4C); transition: width .8s; }
    .g-xp span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: #3B4A2F; text-shadow: 0 1px 0 rgba(255,255,255,.7); white-space: nowrap; }
    .g-streak { font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 16px; color: #D9622C; background: #FFEBDD; border-radius: 12px; padding: 6px 9px; flex-shrink: 0; }
    .g-toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 19; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .g-toast { font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 14.5px; border: 3px solid #fff; border-radius: 999px; padding: 7px 14px; cursor: pointer; box-shadow: var(--g-shadow); background: #F1EAFB; color: #6B4CA3; animation: g-bounce 2s ease-in-out infinite; }
    .g-toast.mail { background: #FFE3E0; color: #B5423A; }
    @keyframes g-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .g-menu { position: fixed; top: 14px; right: 14px; z-index: 20; width: 200px; background: rgba(255,251,242,.94); border: 3px solid #fff; border-radius: 22px; box-shadow: var(--g-shadow); padding: 8px; }
    .g-menu-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 6px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; color: #8A6A45; font-size: 15px; }
    .g-menu-toggle { display: none; border: none; background: #FFF0D6; border-radius: 10px; padding: 4px 9px; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; color: #8E5E33; cursor: pointer; }
    .g-menu-item { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: none; background: none; border-radius: 12px; cursor: pointer;
      font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 15.5px; color: #4A3A2C; text-align: left; }
    .g-menu-item:hover, .g-menu-item.active { background: #FFF0CC; }
    .g-menu-item .e { width: 26px; text-align: center; font-size: 18px; }
    .g-menu-item .b { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: #E05A4F; color: #fff; font-size: 12px; line-height: 22px; text-align: center; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; }
    .g-menu-item .b.soft { background: #FFE7A8; color: #8A5A10; }
    .g-menu-sep { height: 2px; background: #F1E6D2; margin: 5px 8px; border-radius: 2px; }
    .g-hint { position: fixed; left: 14px; bottom: 14px; z-index: 18; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 13.5px; color: #4A3A2C; background: rgba(255,251,242,.85); border: 2px solid #fff; border-radius: 999px; padding: 6px 13px; pointer-events: none; }
    body[data-tod-ui="night"] .g-hint { background: rgba(40,48,90,.7); color: #EEF0FF; border-color: rgba(255,255,255,.5); }
    @media (max-width: 720px) {
      .g-menu { top: auto; bottom: 12px; right: 12px; width: auto; padding: 6px; }
      .g-menu-toggle { display: inline-block; font-size: 16px; padding: 8px 14px; }
      .g-menu-head { padding: 0; gap: 8px; }
      .g-menu-head .t { display: none; }
      .g-menu:not(.open) .g-menu-list { display: none; }
      .g-menu.open { width: 220px; }
      .g-menu.open .g-menu-head .t { display: inline; }
      .g-hint { display: none; }
      .g-player { padding: 7px 10px 7px 7px; gap: 8px; }
      .g-avatar { width: 44px; height: 44px; font-size: 26px; }
      .g-xp { width: 150px; }
      .g-toasts { top: auto; bottom: 74px; left: 12px; transform: none; justify-content: flex-start; }
    }

    /* ---------- 패널 (일지·캘린더·보너스·내 친구) ---------- */
    .g-panel { position: fixed; top: 14px; left: 14px; bottom: 14px; z-index: 30; width: min(470px, calc(100vw - 28px)); display: flex; flex-direction: column;
      background: var(--g-cream); border: 4px solid #E3C48E; border-radius: 26px; box-shadow: 0 8px 0 #C9A26A, 0 24px 50px rgba(30,30,60,.3); overflow: hidden;
      animation: g-panel-in .35s cubic-bezier(.22,1.2,.4,1); }
    .g-panel.small { bottom: auto; }
    @keyframes g-panel-in { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
    .g-panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; background: linear-gradient(#F7DCA8, #EECB8A); border-bottom: 3px solid #E3C48E; }
    .g-panel-title { font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 22px; color: #6B4420; flex: 1; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
    .g-panel-close { width: 38px; height: 38px; border-radius: 50%; border: 3px solid #fff; background: #E07B5F; color: #fff; font-size: 17px; cursor: pointer; box-shadow: 0 3px 0 #B2573E; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; }
    .g-panel-body { padding: 16px; overflow-y: auto; flex: 1; }
    .g-panel-body > .ej-card:first-child, .g-panel-body > div > .ej-card:first-child { margin-top: 0 !important; }
    @media (max-width: 720px) { .g-panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 82vh; } .g-panel.small { bottom: 8px; } @keyframes g-panel-in { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } } }
    .g-stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
    .g-stat { flex: 1; background: #fff; border: 2px solid #EBDDC3; border-radius: 16px; padding: 10px; text-align: center; box-shadow: 0 3px 0 #EBDDC3; }
    .g-stat b { display: block; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 700; font-size: 24px; color: #3B2F2A; font-weight: 700; }

    const BADGE_TIERS = [
      { min: 0,   label: '알',     emoji: '🥚', color: '#B08A5A', bg: '#F6ECDD' },

    function esc(s) {
      return (s === null || s === undefined ? '' : String(s))
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function todayStr() {

    function formatDate(dateStr) {

    function monthKey_(dateStr) { return dateStr.slice(0, 7); }
    function quarterKey_(dateStr) {
      const y = dateStr.slice(0, 4);

      const q = Math.ceil(m / 3);

    function buildReportData(entries, grouping) {
      const keyFn = grouping === 'quarter' ? quarterKey_ : monthKey_;
      const byStudent = {};
      const periodSet = new Set();
      entries.forEach(function (e) {
        const key = keyFn(e.date);
        periodSet.add(key);
        if (!byStudent[e.studentName]) byStudent[e.studentName] = {};
        if (!byStudent[e.studentName][key]) byStudent[e.studentName][key] = { count: 0, pointsSum: 0, pointsCount: 0 };
        const bucket = byStudent[e.studentName][key];
        bucket.count++;
        if (typeof e.points === 'number') { bucket.pointsSum += e.points; bucket.pointsCount++; }
      });
      const periods = Array.from(periodSet).sort();
      return { byStudent: byStudent, periods: periods };
    }

    function csvCell_(v) {
      const s = (v === null || v === undefined) ? '' : String(v);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    function csvFromRows_(rows) {
      return '\uFEFF' + rows.map(function (row) { return row.map(csvCell_).join(','); }).join('\r\n');
    }
    function buildEntriesCsv(entries) {
      const rows = [['학급', '번호', '이름', '날짜', '배운 내용', '참여한 것', '느낀 점', '선생님께 하고 싶은 말', '포인트', '피드백']];
      entries.slice().sort(function (a, b) { return a.date.localeCompare(b.date); }).forEach(function (e) {
        rows.push([
          e.className || '', e.studentNumber != null ? e.studentNumber : '', e.studentName || '', e.date || '',
          e.learned || '', e.participation || '', e.feeling || '', e.message || '',
          typeof e.points === 'number' ? e.points : '', e.feedback || ''
        ]);
      });
      return csvFromRows_(rows);
    }
    function buildReportCsv(cls, roster, report, period) {
      const rows = [['학생', '기간', '일지 개수', '평균 점수', '누적 피드백 받은 일지', '편지 답장', '단어장']];
      roster.forEach(function (student) {
        const bucket = (report.byStudent[student.name] || {})[period];
        const avg = bucket && bucket.pointsCount > 0 ? (bucket.pointsSum / bucket.pointsCount).toFixed(1) : '';
        const mail = mailReplyStats(cls, student.number);
        const label = (student.number != null ? student.number + '번 ' : '') + student.name;
        const words = studentWordsFor(cls, student.number).map(function (w) { return w.word; }).join(', ');
        rows.push([
          label, period || '',
          bucket ? bucket.count : 0,
          avg,
          cumulativeFeedbackCount(cls, student.name),
          mail.replied + '/' + mail.total,
          words
        ]);
      });
      return csvFromRows_(rows);
    }
    function downloadCsv(filename, csvContent) {

        a.href = url; a.download = filename;
        document.body.appendChild(a);
        a.click();

        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      } catch (e) {
        window.open('data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent), '_blank');
      }
    }

    // ---- 우편함 ----

    function msToDateLabel_(ms) {
      const d = new Date(ms);
      return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.';
    }

    function dateStrToUtc_(dateStr) {
      const parts = dateStr.split('-').map(Number);
      return Date.UTC(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
    }
    function utcToDateStr_(ms) {
      const d = new Date(ms);
      const p = function (n) { return String(n).padStart(2, '0'); };
      return d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
    }
    function addDaysUtc_(ms, days) { return ms + days * 86400000; }

    function computeStreak(entries) {
      const dateSet = new Set(entries.map(function (e) { return e.date; }));
      const todayMs = dateStrToUtc_(todayStr());
      let cursor = todayMs;
      let streak = 0;
      if (dateSet.has(utcToDateStr_(cursor))) {
        streak = 1;
        cursor = addDaysUtc_(cursor, -1);
      } else {
        cursor = addDaysUtc_(cursor, -1);
        if (dateSet.has(utcToDateStr_(cursor))) {
          streak = 1;
          cursor = addDaysUtc_(cursor, -1);
        } else {
          return 0;
        }
      }
      while (dateSet.has(utcToDateStr_(cursor))) {
        streak++;
        cursor = addDaysUtc_(cursor, -1);
      }
      return streak;
    }

    function computeMiniStats(entries) {
      const now = new Date();
      const dow = now.getDay();
      const mondayOffset = (dow === 0) ? -6 : 1 - dow;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + mondayOffset);
      const mondayStr = monday.getFullYear() + '-' + String(monday.getMonth() + 1).padStart(2, '0') + '-' + String(monday.getDate()).padStart(2, '0');
      const monthPrefix = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

      const weekEntries = entries.filter(function (e) { return e.date >= mondayStr && e.date <= todayStr(); });
      const monthEntries = entries.filter(function (e) { return e.date.slice(0, 7) === monthPrefix; });

      function avgLabel(list) {
        const scored = list.filter(function (e) { return typeof e.points === 'number'; });
        if (scored.length === 0) return '-';
        const avg = scored.reduce(function (s, e) { return s + e.points; }, 0) / scored.length;
        return avg.toFixed(1) + '점';
      }
      return {
        weekCount: weekEntries.length,
        weekAvg: avgLabel(weekEntries),
        monthCount: monthEntries.length,
        monthAvg: avgLabel(monthEntries)
      };
    }

    function wordCollectorCardHtml() {

    // ---- 학습일지 임시저장 (이 기기/브라우저의 localStorage) ----
    function draftKey() {
      return 'ej_entry_draft_' + STATE.studentClass + '_' + STATE.studentNumber + '_' + STATE.studentName;
    }
    function loadDraft() {
      try {
        const raw = localStorage.getItem(draftKey());
        if (!raw) return null;
        const d = JSON.parse(raw);
        if (!d || !(d.learned || d.feeling || d.message)) return null;
        return d;
      } catch (e) { return null; }
    }
    function saveDraft(d) {
      try {
        if (!(d.learned || d.feeling || d.message)) { localStorage.removeItem(draftKey()); return true; }
        d.savedAt = Date.now();
        localStorage.setItem(draftKey(), JSON.stringify(d));
        return true;
      } catch (e) { return false; }
    }
    function clearDraft() { try { localStorage.removeItem(draftKey()); } catch (e) {} }
    function draftTimeLabel(ts) {
      const d = new Date(ts);
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2);
    }

    // ---- 오늘의 단어 짝맞추기 (하루 1회, 만점이면 +1점) ----
    const WG_COLORS = [
      { bg: '#e3efff', bd: '#5b8fd9' }, { bg: '#ffeed2', bd: '#e0993a' }, { bg: '#e0f3e0', bd: '#4fa35a' },
      { bg: '#fde3ee', bd: '#d86a96' }, { bg: '#ece3ff', bd: '#8a6ad8' }
    ];
    function openWordGameModal() {
      const existing = document.getElementById('ej-wg-overlay');
      if (existing) existing.remove();
      const overlay = document.createElement('div');
      overlay.id = 'ej-wg-overlay';
      overlay.className = 'ej-mail-overlay';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function (ev) { if (ev.target === overlay) overlay.remove(); });

      // 게임 상태 (모달 안에서만 사용)
      const G = { phase: 'loading', words: [], meanings: [], pairs: {}, sel: null, err: '', busy: false, result: null, played: null };

      function shell(inner) {
        return '<div class="ej-mail-modal">' +
          '<button id="wg-close" class="ej-mail-modal-close" aria-label="닫기">✕</button>' +
          '<h2 class="ej-serif" style="font-size:26px;font-weight:700;margin:0 0 4px;text-align:center">🎮 오늘의 단어 짝맞추기</h2>' +
          inner + '</div>';
      }
      function paint() {
        let inner = '';
        if (G.phase === 'loading') {
          inner = '<div class="ej-card ej-empty" style="margin-top:14px">불러오는 중…</div>';
        } else if (G.phase === 'error') {
          inner = '<div class="ej-error" style="margin-top:14px">' + esc(G.err) + '</div>';
        } else if (G.phase === 'played') {
          inner = '<div class="ej-card" style="padding:22px;text-align:center;margin-top:14px">' +
            '<div style="font-size:34px">' + (G.played.perfect ? '🏆' : '📚') + '</div>' +
            '<div class="ej-serif" style="font-size:18px;font-weight:700;margin:8px 0 4px">오늘은 이미 도전했어요!</div>' +
            '<div style="color:var(--ej-ink-soft);font-size:13px">오늘 결과: ' + G.played.score + ' / 5' + (G.played.perfect ? ' · 만점 +1점 받았어요' : '') + '</div>' +
            '<div style="color:var(--ej-ink-soft);font-size:13px;margin-top:6px">새로운 단어는 내일 다시 열려요.</div></div>';
        } else if (G.phase === 'play') {
          const n = G.words.length;
          const pairedMeaning = {};
          Object.keys(G.pairs).forEach(function (wi) { pairedMeaning[G.pairs[wi]] = Number(wi); });
          const done = Object.keys(G.pairs).length;
          inner = '<p style="color:var(--ej-ink-soft);font-size:12px;margin:0 0 12px;text-align:center">영어 단어를 누르고, 알맞은 뜻을 눌러 짝을 지어요. 5개를 모두 맞히면 <b>+1점</b>! 하루에 한 번만 도전할 수 있어요.</p>';
          inner += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 10px">';
          for (let i = 0; i < n; i++) {
            const wi = i;
            const wPaired = G.pairs[wi] !== undefined;
            const wc = WG_COLORS[wi];
            const wStyle = wPaired ? 'background:' + wc.bg + ';border-color:' + wc.bd : (G.sel === wi ? 'border-color:var(--ej-accent,#c98a2b);box-shadow:0 0 0 3px rgba(201,138,43,.25)' : '');
            inner += '<button type="button" class="ej-wg-item wg-word" data-i="' + wi + '" style="' + wStyle + '">' + (wPaired ? '<span class="ej-wg-badge" style="background:' + wc.bd + '">' + (wi + 1) + '</span>' : '') + esc(G.words[wi]) + '</button>';
            const mj = i;
            const owner = pairedMeaning[mj];
            const mStyle = owner !== undefined ? 'background:' + WG_COLORS[owner].bg + ';border-color:' + WG_COLORS[owner].bd : '';
            inner += '<button type="button" class="ej-wg-item wg-meaning" data-j="' + mj + '" style="' + mStyle + '">' + (owner !== undefined ? '<span class="ej-wg-badge" style="background:' + WG_COLORS[owner].bd + '">' + (owner + 1) + '</span>' : '') + esc(G.meanings[mj]) + '</button>';
          }
          inner += '</div>';
          if (G.err) inner += '<div class="ej-error" style="margin-top:12px">' + esc(G.err) + '</div>';
          inner += '<div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
            '<span style="font-size:12px;color:var(--ej-ink-soft)">짝 지은 개수 ' + done + ' / ' + n + ' · 제출하면 다시 도전할 수 없어요</span>' +
            '<button type="button" id="wg-submit" class="ej-btn ej-btn-primary"' + ((done < n || G.busy) ? ' disabled' : '') + '>' + (G.busy ? '채점하는 중…' : '제출하기') + '</button></div>';
        } else if (G.phase === 'result') {
          const r = G.result;
          inner = '<div class="ej-card" style="padding:20px;margin-top:14px">' +
            '<div style="text-align:center;margin-bottom:12px"><div style="font-size:34px">' + (r.perfect ? '🎉' : '👍') + '</div>' +
            '<div class="ej-serif" style="font-size:20px;font-weight:700;margin-top:4px">' + r.score + ' / 5 정답</div>' +
            '<div style="font-size:13px;margin-top:4px;color:' + (r.perfect ? 'var(--ej-success,#2e7d4f)' : 'var(--ej-ink-soft)') + '">' +
              (r.perfect ? '만점! 보너스 +1점이 들어갔어요.' : '아쉬워요. 내일 또 도전해 봐요!') + '</div></div>';
          r.answers.forEach(function (a) {
            const wi = G.words.indexOf(a.word);
            const mine = (wi >= 0 && G.pairs[wi] !== undefined) ? G.meanings[G.pairs[wi]] : '';
            inner += '<div style="display:flex;gap:8px;padding:7px 0;border-top:1px dashed var(--ej-line);font-size:14px;align-items:baseline">' +
              '<span style="width:20px;flex:none">' + (a.correct ? '✅' : '❌') + '</span>' +
              '<b style="min-width:90px;flex:none">' + esc(a.word) + '</b>' +
              (a.correct
                ? '<span style="color:var(--ej-ink-soft)">' + esc(a.meaning) + '</span>'
                : '<span style="color:#9a9a9a;text-decoration:line-through;text-decoration-thickness:1.5px">' + esc(mine || '(선택 안 함)') + '</span>' +
                  '<span style="color:#d93025;font-weight:700;margin-left:8px">' + esc(a.meaning) + '</span>') +
              '</div>';
          });
          inner += '</div>';
        }
        // 클릭할 때마다 모달이 다시 '펼쳐지는' 애니메이션(깜빡임)이 반복되지 않도록, 첫 그림 이후엔 애니메이션을 끈다.
        const oldModal = overlay.querySelector('.ej-mail-modal');
        const keepTop = oldModal ? oldModal.scrollTop : 0;
        const keepOverlayTop = overlay.scrollTop;
        overlay.innerHTML = shell(inner);
        if (G.painted) overlay.classList.add('ej-wg-still');
        G.painted = true;
        const newModal = overlay.querySelector('.ej-mail-modal');
        if (newModal) newModal.scrollTop = keepTop;
        overlay.scrollTop = keepOverlayTop;
        bind();
      }
      function bind() {
        const c = overlay.querySelector('#wg-close');
        if (c) c.onclick = function () { overlay.remove(); };
        overlay.querySelectorAll('.wg-word').forEach(function (b) {
          b.onclick = function () {
            if (G.busy) return;
            const i = Number(b.getAttribute('data-i'));
            G.err = '';
            if (G.pairs[i] !== undefined) { delete G.pairs[i]; G.sel = i; }
            else G.sel = (G.sel === i) ? null : i;
            paint();
          };
        });
        overlay.querySelectorAll('.wg-meaning').forEach(function (b) {
          b.onclick = function () {
            if (G.busy) return;
            const j = Number(b.getAttribute('data-j'));
            G.err = '';
            let owner = null;
            Object.keys(G.pairs).forEach(function (wi) { if (G.pairs[wi] === j) owner = Number(wi); });
            if (G.sel === null) {
              if (owner !== null) delete G.pairs[owner];
            } else {
              if (owner !== null) delete G.pairs[owner];
              G.pairs[G.sel] = j;
              G.sel = null;
            }
            paint();
          };
        });
        const sub = overlay.querySelector('#wg-submit');
        if (sub) sub.onclick = function () {
          if (G.busy) return;
          G.busy = true; G.err = ''; paint();
          const pairs = Object.keys(G.pairs).map(function (wi) { return { word: G.words[Number(wi)], meaning: G.meanings[G.pairs[wi]] }; });
          gsRun('submitWordGame', STATE.studentClass, STATE.studentNumber, STATE.studentName, pairs).then(function (r) {
            G.busy = false; G.result = r; G.phase = 'result';
            if (r.bonus) { STATE.bonuses.push(r.bonus); render(); }
            paint();
          }).catch(function (err) {
            G.busy = false;
            G.err = (err && err.message) ? err.message : '제출에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요. (고른 짝은 그대로 남아있어요)';
            if (/이미 도전/.test(G.err)) { G.phase = 'error'; }
            paint();
          });
        };
      }
      paint();
      gsRun('startWordGame', STATE.studentClass, STATE.studentNumber, STATE.studentName).then(function (r) {
        if (r.played) { G.played = r; G.phase = 'played'; }
        else { G.words = r.words; G.meanings = r.meanings; G.phase = 'play'; }
        paint();
      }).catch(function (err) {
        G.phase = 'error';
        G.err = (err && err.message) ? err.message : '불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
        paint();
      });
    }

    // ---- 단어사전 팝업 ----
    function dictChipsHtml(list) {
      return list.map(function (x) { return '<span class="ej-dict-chip">' + esc(x) + '</span>'; }).join('');
    }
    function openDictionaryModal() {
      const existing = document.getElementById('ej-dict-overlay');
      if (existing) existing.remove();
      const overlay = document.createElement('div');
      overlay.id = 'ej-dict-overlay';
      overlay.className = 'ej-mail-overlay';
      overlay.innerHTML = '<div class="ej-mail-modal">' +
        '<button id="dict-close" class="ej-mail-modal-close" aria-label="닫기">✕</button>' +
        '<h2 class="ej-serif" style="font-size:26px;font-weight:700;margin:0 0 4px;text-align:center">🔍 단어사전</h2>' +
        '<p style="color:var(--ej-ink-soft);font-size:12px;margin-bottom:14px;text-align:center">영어 단어를 검색하면 뜻, 동의어, 반의어를 알려줘요.</p>' +
        '<form id="dict-form" style="display:flex;gap:8px;margin-bottom:14px">' +
          '<input id="dict-input" class="ej-input" maxlength="40" placeholder="예: happy" autocomplete="off" autocapitalize="none" style="flex:1">' +
          '<button type="submit" id="dict-submit" class="ej-btn ej-btn-primary">검색</button></form>' +
        '<div id="dict-result"></div></div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeDictionaryModal(); });
      overlay.querySelector('#dict-close').onclick = closeDictionaryModal;
      const input = overlay.querySelector('#dict-input');
      const box = overlay.querySelector('#dict-result');
      const btn = overlay.querySelector('#dict-submit');
      setTimeout(function () { input.focus(); }, 50);
      overlay.querySelector('#dict-form').onsubmit = function (ev) {
        ev.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        btn.disabled = true; btn.textContent = '검색 중…';
        box.innerHTML = '<div class="ej-card ej-empty">찾는 중…</div>';
        gsRun('lookupWord', q).then(function (r) {
          btn.disabled = false; btn.textContent = '검색';
          const already = studentWordsFor(STATE.studentClass, STATE.studentNumber).some(function (w) { return String(w.word).toLowerCase() === r.word; });
          let h = '<div class="ej-card" style="padding:18px;text-align:left">';
          h += '<div class="ej-serif" style="font-size:22px;font-weight:700">' + esc(r.word) + '</div>';
          h += '<div style="font-size:16px;margin:6px 0 2px">' + ({n:'(명사) ',v:'(동사) ',adj:'(형용사) ',adv:'(부사) '}[r.pos] || '') + (r.meaning ? esc(r.meaning) : '뜻을 찾지 못했어요') + '</div>';
          h += '<div style="font-size:12px;color:var(--ej-ink-soft);margin-bottom:12px">뜻은 자동 번역이라 참고용이에요.</div>';
          h += '<div class="ej-eyebrow" style="margin-bottom:6px">동의어</div><div class="ej-dict-chips">' + (r.synonyms.length ? dictChipsHtml(r.synonyms) : '<span style="color:var(--ej-ink-soft);font-size:13px">동의어 없음</span>') + '</div>';
          h += '<div class="ej-eyebrow" style="margin:12px 0 6px">반의어</div><div class="ej-dict-chips">' + (r.antonyms.length ? dictChipsHtml(r.antonyms) : '<span style="color:var(--ej-ink-soft);font-size:13px">반의어 없음</span>') + '</div>';
          h += '<div style="margin-top:16px;text-align:right"><button type="button" id="dict-add" class="ej-btn ej-btn-ghost"' + (already ? ' disabled' : '') + '>' + (already ? '✓ 단어장에 있어요' : '＋ 단어장에 추가') + '</button></div>';
          h += '</div>';
          box.innerHTML = h;
          const addBtn = box.querySelector('#dict-add');
          if (addBtn && !already) addBtn.onclick = function () {
            addBtn.disabled = true; addBtn.textContent = '저장하는 중…';
            gsRun('addWord', STATE.studentClass, STATE.studentNumber, STATE.studentName, r.word, r.meaning || '', '').then(function (w) {
              STATE.words.push(w);
              addBtn.textContent = '✓ 단어장에 추가했어요';
              render();
            }).catch(function (err) {
              addBtn.disabled = false; addBtn.textContent = '＋ 단어장에 추가';
              let eb = box.querySelector('.ej-error');
              if (!eb) { eb = document.createElement('div'); eb.className = 'ej-error'; box.appendChild(eb); }
              eb.textContent = (err && err.message) ? err.message : '저장에 실패했어요. 다시 눌러주세요.';
            });
          };
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = '검색';
          box.innerHTML = '<div class="ej-error">' + esc((err && err.message) ? err.message : '검색에 실패했어요. 잠시 후 다시 시도해 주세요.') + '</div>';
        });
      };
    }
    function closeDictionaryModal() {
      const overlay = document.getElementById('ej-dict-overlay');
      if (overlay) overlay.remove();
    }

    // ---- 칭찬 보너스 팝업 (학생 랭킹 화면에서 바로 지급) ----
    function bonusModalInnerHtml(cls, num, name) {
      const numberLabel = num != null ? num + '번 ' : '';
      return '<div class="ej-card" style="max-width:380px;width:100%;padding:24px;text-align:left">' +
        '<button id="bonus-modal-close" class="ej-mail-modal-close" aria-label="닫기">✕</button>' +
        '<div class="ej-eyebrow" style="margin-bottom:6px">🎉 칭찬 보너스</div>' +
        '<h3 class="ej-serif" style="font-size:17px;margin:0 0 16px">' + esc(numberLabel) + esc(name) + '님에게 보너스 주기</h3>' +
        (STATE.teacherBonusError ? '<div class="ej-error">' + esc(STATE.teacherBonusError) + '</div>' : '') +
        '<form id="bonus-form">' +
          '<div class="ej-field"><div class="ej-field-label">보너스 점수</div>' +
            '<input id="bonus-points" class="ej-input" type="number" min="1" max="50" value="3"></div>' +
          '<div class="ej-field"><div class="ej-field-label">칭찬 이유 <span style="font-weight:400;color:var(--ej-ink-soft)">(선택)</span></div>' +
            '<input id="bonus-reason" class="ej-input" maxlength="80" placeholder="예: 오늘 발표를 정말 잘했어요!"></div>' +
          '<div style="display:flex;gap:10px;margin-top:6px">' +
            '<button type="submit" class="ej-btn ej-btn-primary" ' + (STATE.busy ? 'disabled' : '') + '>' + (STATE.busy ? '지급하는 중…' : '🎉 보너스 지급') + '</button>' +
            '<button type="button" id="cancel-bonus-form" class="ej-btn ej-btn-ghost">취소</button>' +
          '</div>' +
        '</form>' +
      '</div>';
    }
    function openBonusModal(cls, num, name) {
      const existing = document.getElementById('ej-bonus-overlay');
      if (existing) existing.remove();
      STATE.teacherBonusError = '';
      const overlay = document.createElement('div');
      overlay.id = 'ej-bonus-overlay';
      overlay.className = 'ej-mail-overlay';
      overlay.innerHTML = bonusModalInnerHtml(cls, num, name);
      document.body.appendChild(overlay);
      bindBonusModalEvents(overlay, cls, num, name);
      overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeBonusModal(); });
    }
    function closeBonusModal() {
      const overlay = document.getElementById('ej-bonus-overlay');
      if (overlay) overlay.remove();
    }
    function bindBonusModalEvents(overlay, cls, num, name) {
      const closeBtn = overlay.querySelector('#bonus-modal-close');
      if (closeBtn) closeBtn.onclick = closeBonusModal;
      const cancelBtn = overlay.querySelector('#cancel-bonus-form');
      if (cancelBtn) cancelBtn.onclick = closeBonusModal;
      const form = overlay.querySelector('#bonus-form');
      if (form) {
        form.onsubmit = function (ev) {
          ev.preventDefault();
          const points = Number(overlay.querySelector('#bonus-points').value);
          const reason = overlay.querySelector('#bonus-reason').value.trim();
          const submitBtn = form.querySelector('button[type="submit"]');
          if (!points || points < 1 || points > 50) {
            let errBox = form.querySelector('.bonus-form-inline-error');
            if (!errBox) {
              errBox = document.createElement('div');
              errBox.className = 'ej-error bonus-form-inline-error';
              form.insertBefore(errBox, form.firstChild);
            }
            errBox.textContent = '보너스 점수는 1~50 사이로 입력해주세요.';
            return;
          }
          submitBtn.disabled = true;
          submitBtn.textContent = '지급하는 중…';
          gsRun('addBonus', cls, num, name, points, reason).then(function (bonus) {
            STATE.bonuses.unshift(bonus);
            closeBonusModal();
            render();
          }).catch(function (err) {
            // 실패해도 모달을 다시 그리지 않아서, 입력한 점수/사유가 그대로 남아있어요.
            submitBtn.disabled = false;
            submitBtn.textContent = '🎉 보너스 지급';
            let errBox = form.querySelector('.bonus-form-inline-error');
            if (!errBox) {
              errBox = document.createElement('div');
              errBox.className = 'ej-error bonus-form-inline-error';
              form.insertBefore(errBox, form.firstChild);
            }
            errBox.textContent = (err && err.message) ? err.message : '보너스 지급에 실패했어요. 인터넷 연결을 확인하고 다시 눌러주세요.';
          });
        };
      }
    }

    function entryCardHtml(entry, teacherView) {
      let html = '<div class="ej-card" style="padding:20px"><div class="ej-spine"></div><div class="ej-indent">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">' +
        '<div style="font-size:15px;color:var(--ej-ink-soft)">' + esc(formatDate(entry.date)) + '</div>';
      if (typeof entry.points === 'number') {
        html += '<div class="ej-stamp">★ +' + entry.points + 'P</div>';
      }
      html += '</div>';
      html += entryRowHtml('배운내용/나의 참여', [entry.learned, entry.participation].filter(function (t) { return t && t.trim(); }).join('\n\n'));
      html += understandingRowHtml(entry.understanding);
      html += entryRowHtml('느낀 점', entry.feeling);
      if (entry.message) html += messageNoteHtml(entry.message);

      if (entry.feedbackAt) {
        const noteHtml = entry.feedback
          ? feedbackNoteHtml(entry.feedback)
          : '<div style="margin-top:14px;font-size:15px;color:var(--ej-ink-soft);font-style:italic">💬 선생님이 확인하고 점수를 줬어요.</div>';
        if (teacherView) {
          html += '<div class="fb-note-wrap" data-entry-id="' + esc(entry.id) + '">' + noteHtml +
            '<div style="margin-top:6px;text-align:right"><button type="button" class="ej-btn ej-btn-ghost fb-edit-btn" data-entry-id="' + esc(entry.id) + '" style="padding:6px 12px;font-size:12px">✏️ ' + (entry.feedback ? '피드백 수정' : '코멘트 추가') + '</button></div></div>';
        } else {
          html += noteHtml;
        }
      } else if (teacherView) {
        html += (
          '<div class="ej-feedback-form" data-entry-id="' + esc(entry.id) + '" style="margin-top:14px;border-top:1px dashed var(--ej-line);padding-top:14px">' +
            '<div style="font-size:14px;font-weight:700;color:var(--ej-ink-soft);margin-bottom:8px">피드백 남기기 <span style="font-weight:400;color:var(--ej-ink-soft)">(코멘트는 선택, 점수만 줘도 돼요)</span></div>' +
            '<textarea class="ej-textarea fb-text" rows="2" placeholder="학생에게 전할 한마디를 적어주세요. (선택)" style="margin-bottom:10px"></textarea>' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
              '<div class="ej-star-row">' +
                [1,2,3,4,5].map(function (n) {
                  return '<button type="button" class="ej-star-btn fb-star" data-n="' + n + '">' + (n <= 3 ? '★' : '☆') + '</button>';
                }).join('') +
              '<span class="fb-points-label" style="font-size:15px;color:var(--ej-ink-soft);margin-left:4px">3점</span></div>' +
              '<button type="button" class="ej-btn ej-btn-primary fb-submit" style="padding:9px 16px;font-size:12px">✉ 피드백 보내기</button>' +
            '</div>' +
          '</div>'
        );
      } else {
        html += '<div style="margin-top:12px;font-size:15px;color:var(--ej-ink-soft);font-style:italic">아직 선생님 피드백을 기다리고 있어요.</div>';

    function entryRowHtml(label, text) {
      return '<div style="margin-bottom:10px">' +
        '<div style="font-size:14px;font-weight:700;color:var(--ej-sage);margin-bottom:2px">' + esc(label) + '</div>' +

    function understandingRowHtml(level) {

        '<div style="font-size:14px;font-weight:700;color:var(--ej-sage);margin-bottom:2px">이해도</div>' +
        '<div style="font-size:16px;color:var(--ej-gold);letter-spacing:2px">' + filled + '</div></div>';

      return '<div class="ej-feedback-note">' +

        '<div style="font-size:13px;line-height:1.6;color:var(--ej-ink)">' + nl2br(text) + '</div></div>';

        '<div style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ej-gold);margin-bottom:4px">🙋 선생님께 하고 싶은 말</div>' +
        '<div style="font-size:13px;line-height:1.6;color:var(--ej-ink)">' + nl2br(text) + '</div></div>';
    }

    function entrySummaryRowHtml(entry) {
      const expanded = STATE.expandedEntryIds.has(entry.id);
      const isNew = STATE.newFeedbackIds.has(entry.id);
      const snippet = entry.learned.length > 26 ? entry.learned.slice(0, 26) + '…' : entry.learned;
      let statusHtml;
      if (typeof entry.points === 'number') {
        statusHtml = '<span class="ej-stamp" style="padding:2px 9px;font-size:13px">★' + entry.points + 'P</span>';
      } else if (entry.feedbackAt) {
        statusHtml = '<span style="font-size:14px;color:var(--ej-ink-soft)">💬</span>';
      } else {
        statusHtml = '<span style="font-size:14px;color:var(--ej-ink-soft)">⏳</span>';
      }
      let html = '<div class="ej-card" style="padding:0">' +
        '<button class="ej-summary-row" data-id="' + esc(entry.id) + '">' +
          '<span class="ej-summary-date">' + esc(formatDate(entry.date)) + '</span>' +
          '<span class="ej-summary-snippet">' + esc(snippet) + '</span>' +
          (isNew ? '<span class="ej-blink" title="새 피드백 도착" style="font-size:14px">🔔</span>' : '') +
          statusHtml +
          '<span class="ej-summary-chevron">' + (expanded ? '▲' : '▼') + '</span>' +
        '</button>';
      if (expanded) {
        html += '<div style="padding:2px 16px 18px;border-top:1px dashed var(--ej-line)">' +
          entryRowHtml('배운내용/나의 참여', [entry.learned, entry.participation].filter(function (t) { return t && t.trim(); }).join('\n\n')) +
          understandingRowHtml(entry.understanding) +
          entryRowHtml('느낀 점', entry.feeling) +
          (entry.message ? messageNoteHtml(entry.message) : '') +
          (entry.feedbackAt
            ? (entry.feedback ? feedbackNoteHtml(entry.feedback) : '<div style="margin-top:10px;font-size:15px;color:var(--ej-ink-soft);font-style:italic">💬 선생님이 확인하고 점수를 줬어요.</div>')
            : '<div style="margin-top:10px;font-size:15px;color:var(--ej-ink-soft);font-style:italic">아직 선생님 피드백을 기다리고 있어요.</div>') +
          '</div>';
      }

        const wordRoster = roster.slice();

            '<div style="font-size:12px;color:var(--ej-ink-soft);margin-top:8px">' + points + 'P · 일지 ' + studentEntries.length + '개 · 최근 ' + (last ? esc(formatDate(last.date)) : '-') + '</div>' +

            '</div></button>';
        });
        html += '</div>';
      }
      html += '</div></div>';
      html += '</div>';
      return html;
    }

            (w.example ? '<div style="margin-top:4px;font-size:12px;color:var(--ej-ink);line-height:1.5">“' + esc(w.example) + '”</div>' : '') +

    function bindEvents() {
      byId('go-teacher', function (el) { el.onclick = function () { STATE.screen = 'teacherPassword'; STATE.passwordError = ''; render(); }; });
      byId('back-to-role-pw', function (el) { el.onclick = function () { stopTeacherPolling(); STATE.screen = 'role'; render(); }; });

              startTeacherPolling();
              render();
            } else {
              STATE.passwordError = '비밀번호가 올바르지 않아요.';
              render();
            }
          }).catch(function () {
            STATE.busy = false;

            render();
          });
        };
      });

      byId('student-setup-form', function (form) {
        form.onsubmit = function (ev) {

          const grade = document.getElementById('setup-grade').value.trim();
          const classNum = document.getElementById('setup-classnum').value.trim();
          const number = document.getElementById('setup-number').value.trim();
          const name = document.getElementById('setup-name').value.trim();
          const password = document.getElementById('setup-password').value.trim();
          if (!grade || !classNum || !number || !name || !password) {
            STATE.saveError = '학년, 반, 번호, 이름, 비밀번호를 모두 입력해주세요.';
            render();
            return;
          }
          if (Number(grade) < 1 || Number(grade) > 3) {
            STATE.saveError = '학년은 1~3 사이의 숫자로 입력해주세요.';
            render();
            return;
          }
          if (Number(classNum) < 1 || Number(classNum) > 10) {
            STATE.saveError = '반은 1~10 사이의 숫자로 입력해주세요.';
            render();
            return;
          }
          if (name.length < 2 || name.length > 4) {
            STATE.saveError = '이름은 2~4글자로 입력해주세요.';
            render();
            return;
          }
          if (!/^\d{4}$/.test(password)) {
            STATE.saveError = '비밀번호는 숫자 4자리로 입력해주세요.';
            render();
            return;
          }
          const cls = grade + '학년 ' + classNum + '반';
          STATE.busy = true; STATE.saveError = ''; render();
          gsRun('studentLogin', cls, number, name, password).then(function (account) {
            return gsRun('addClassName', account.className).then(function (classes) {
              STATE.classes = classes;
              STATE.studentClass = account.className;
              STATE.studentName = account.studentName;
              STATE.studentNumber = account.studentNumber;

              computeNewFeedback(account.className, account.studentName, account.studentNumber);
              STATE.expandedEntryIds = new Set();
              STATE.selectedMonth = 'all';
              STATE.calendarSelectedDate = null;
              STATE.calendarYear = new Date().getFullYear();
              STATE.calendarMonth = new Date().getMonth();
              saveSession(account.className, account.studentNumber, account.studentName);
              checkTierUpAndCelebrate(
                account.className, account.studentNumber,
                studentTotalPoints(account.className, account.studentName)
              );

              STATE.screen = 'studentHome';
              STATE.showEntryForm = false;
              STATE.busy = false;
              render();
            });
          }).catch(function (err) {
            STATE.busy = false;
            STATE.saveError = (err && err.message) ? err.message : '입장에 실패했어요. 다시 시도해 주세요.';
            render();
          });
        };
      });
