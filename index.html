          closeWordCollectorModal();
          clearSession();
          STATE.studentName = ''; STATE.studentClass = ''; STATE.studentNumber = null; STATE.selectedMonth = 'all'; STATE.screen = 'role'; render();
        };
      });
      byId('go-student-mailbox', function (el) {
        el.onclick = function () { STATE.studentMailError = ''; openMailboxModal(); };
      });
      byId('go-study-room', function (el) {
        el.onclick = function () { openStudyRoomModal(); };
      });
      byId('go-wordgame', function (el) {
        el.onclick = function () { openWordGameModal(); };
      });
      byId('go-dictionary', function (el) {
        el.onclick = function () { openDictionaryModal(); };
      });

      byId('open-word-collector', function (el) {
        el.onclick = function () { openWordCollectorModal(); };
      });

      byId('calendar-prev', function (el) {
        el.onclick = function () {
          ensureCalendarState_();
          STATE.calendarMonth--;
          if (STATE.calendarMonth < 0) { STATE.calendarMonth = 11; STATE.calendarYear--; }
          STATE.calendarSelectedDate = null;
          render();
        };
      });
      byId('calendar-next', function (el) {
        el.onclick = function () {
          ensureCalendarState_();
          STATE.calendarMonth++;
          if (STATE.calendarMonth > 11) { STATE.calendarMonth = 0; STATE.calendarYear++; }
          STATE.calendarSelectedDate = null;
          render();
        };
      });
      byClass('ej-calendar-day', function (el) {
        el.onclick = function () {
          const dateStr = el.getAttribute('data-calendar-date');
          if (!dateStr) return;
          STATE.calendarSelectedDate = dateStr;
          const entry = STATE.entries.filter(function (e) {
            return e.className === STATE.studentClass && e.studentName === STATE.studentName && e.date === dateStr;
          }).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); })[0];
          if (entry) {
            STATE.expandedEntryIds.add(entry.id);
            STATE.selectedMonth = monthKey_(dateStr);
          }
          render();
          if (entry) {
            setTimeout(function () {
              const row = document.querySelector('.ej-summary-row[data-id="' + entry.id + '"]');
              if (row && row.scrollIntoView) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 50);
          }
        };
      });

      byId('show-entry-form', function (el) { el.onclick = function () { STATE.showEntryForm = true; render(); }; });
      byId('month-filter', function (el) {
        el.onchange = function () { STATE.selectedMonth = el.value; render(); };
      });
      byClass('ej-summary-row', function (el) {
        el.onclick = function () {
          const id = el.getAttribute('data-id');
          if (STATE.expandedEntryIds.has(id)) {
            STATE.expandedEntryIds.delete(id);
          } else {
            STATE.expandedEntryIds.add(id);
            if (STATE.newFeedbackIds.has(id)) {
              STATE.newFeedbackIds.delete(id);
              markFeedbackConfirmed(STATE.studentClass, STATE.studentNumber, id);
            }
          }
          render();
        };

      byId('understanding-stars', function (row) {

        const label = document.getElementById('understanding-label');
        const stars = row.querySelectorAll('.understanding-star');
        stars.forEach(function (starBtn) {
          starBtn.onclick = function () {
            const n = Number(starBtn.getAttribute('data-n'));
            hiddenInput.value = n;
            stars.forEach(function (s, i) { s.textContent = (i < n) ? '★' : '☆'; });
            label.textContent = n + '점';
          };

      });
      byId('entry-form', function (form) {
        // --- 임시저장: 복원 + 자동저장 ---
        const $d = function (id) { return document.getElementById(id); };
        const readDraftFromForm = function () {
          return {
            date: $d('entry-date').value, learned: $d('entry-learned').value, feeling: $d('entry-feeling').value,
            message: $d('entry-message').value, understanding: Number($d('entry-understanding').value) || 3
          };
        };
        const setStatus = function (txt) { const st = $d('draft-status'); if (st) st.textContent = txt; };
        const existingDraft = loadDraft();
        if (existingDraft) {
          if (existingDraft.date && existingDraft.date <= todayStr()) $d('entry-date').value = existingDraft.date;
          $d('entry-learned').value = existingDraft.learned || '';
          $d('entry-feeling').value = existingDraft.feeling || '';
          $d('entry-message').value = existingDraft.message || '';
          const n = Number(existingDraft.understanding) || 3;
          $d('entry-understanding').value = n;
          form.querySelectorAll('.understanding-star').forEach(function (s2, i) { s2.textContent = (i < n) ? '★' : '☆'; });
          const lbl = $d('understanding-label'); if (lbl) lbl.textContent = n + '점';
          setStatus('📝 임시저장된 내용을 불러왔어요 (' + draftTimeLabel(existingDraft.savedAt) + ')');
        }
        let draftTimer = null;
        const doSaveDraft = function (manual) {
          const ok = saveDraft(readDraftFromForm());
          if (!ok) { setStatus('⚠️ 이 브라우저에서는 임시저장을 쓸 수 없어요. 일지를 바로 저장해 주세요.'); return; }
          setStatus('✅ 임시저장됨 (' + draftTimeLabel(Date.now()) + ')');
        };
        ['entry-date', 'entry-learned', 'entry-feeling', 'entry-message'].forEach(function (id) {
          const el = $d(id);
          el.addEventListener('input', function () {
            clearTimeout(draftTimer);
            draftTimer = setTimeout(function () { doSaveDraft(false); }, 700);
          });
        });
        const starRow = $d('understanding-stars');
        if (starRow) starRow.addEventListener('click', function () { setTimeout(function () { doSaveDraft(false); }, 0); });
        const draftBtn = $d('draft-save-btn');
        if (draftBtn) draftBtn.onclick = function () { clearTimeout(draftTimer); doSaveDraft(true); };

        form.onsubmit = function (ev) {
          ev.preventDefault();
          const date = document.getElementById('entry-date').value || todayStr();
          const learned = document.getElementById('entry-learned').value.trim();
          const feeling = document.getElementById('entry-feeling').value.trim();
          const message = document.getElementById('entry-message').value.trim();
          const understanding = Number(document.getElementById('entry-understanding').value) || 3;
          if (!learned || !feeling) return;
          const submitBtn = form.querySelector('button[type="submit"]');
          submitBtn.disabled = true;

      // 내년용 Apps Script 웹 앱 주소(/exec로 끝나요). 비워 두면 '체험 모드'(가짜 데이터)로 돌아가요.

    // ---------------- 서버 연결 ----------------
    // 1) Apps Script 안에서 열리면 → google.script.run (지금 방식 그대로)
    // 2) Vercel 등에서 열리고 API_URL이 있으면 → Apps Script 웹 앱에 fetch 요청
    // 3) 둘 다 아니면 → 체험 모드 (이 브라우저에만 저장되는 가짜 데이터)
    const RUN_MODE = (window.google && google.script && google.script.run) ? 'appsscript' : (APP_CONFIG.API_URL ? 'api' : 'demo');

    function gsRun(fnName) {
      const args = Array.prototype.slice.call(arguments, 1);
      if (RUN_MODE === 'appsscript') {
        return new Promise(function (resolve, reject) {
          google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) { reject(err); })[fnName].apply(null, args);
        });
      }
      if (RUN_MODE === 'api') {
        return fetch(APP_CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 미리보기 요청(CORS) 없이 보내려고 text/plain을 써요
          body: JSON.stringify({ fn: fnName, args: args })
        }).then(function (r) {
          if (!r.ok) throw new Error('서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');
          return r.json();
        }).then(function (res) {
          if (!res || !res.ok) throw new Error((res && res.error) || '서버에서 오류가 났어요.');
          return res.data;
        });
      }
      return new Promise(function (resolve, reject) {
        setTimeout(function () {
          try {
            if (!DEMO_API[fnName]) throw new Error('체험 모드에서는 쓸 수 없는 기능이에요: ' + fnName);
            const out = DEMO_API[fnName].apply(null, args);
            demoSave();
            resolve(JSON.parse(JSON.stringify(out === undefined ? null : out)));
          } catch (e) { reject(e); }
        }, 120 + Math.random() * 180);
      });
    }

          p.setZ(i, p.getZ(i) + (Math.random() - .5) * amt);
        }
        geo.computeVertexNormals();
        return geo;
      }

      // ---------- 초기화 ----------
      W.init = function () {
        container = document.getElementById('world');
        labelLayer = document.getElementById('world-labels');
        bubbleEl = document.getElementById('world-bubble');
        T = window.THREE;
        if (!T || !container) { fallback(); return; }
        try {
          renderer = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
        } catch (e) { fallback(); return; }
        if (!renderer || !renderer.getContext()) { fallback(); return; }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = T.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);
        scene = new T.Scene();
        camera = new T.PerspectiveCamera(34, 1, 0.1, 200);
        CAM.target = new T.Vector3(0, 0.6, 0.4); CAM.tTarget = CAM.target.clone();
        clock = new T.Clock();
        root = new T.Group(); scene.add(root);
        buildLights();
        buildIsland();
        buildObjects();
        buildDecor();
        buildSky();
        setTimeOfDay();
        bindPointer();
        bindKeys();
        window.addEventListener('resize', resize);
        resize();
        W.ready = true;
        container.classList.add('w-ready');
        requestAnimationFrame(loop);
        setInterval(setTimeOfDay, 60000);
      };

      function fallback() {
        W.ready = false;
        if (container) container.classList.add('w-fallback');
      }

      function resize() {
        if (!renderer) return;
        const w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        const fit = w / h < 1 ? 1.75 : (w / h < 1.3 ? 1.25 : 1);
        CAM.base = 33 * fit;
        CAM.tr = CAM.focus ? 13 * Math.min(fit, 1.3) : CAM.base;
      }

      // ---------- 빛 ----------
      function buildLights() {
        hemi = new T.HemisphereLight(0xcfefff, 0x86b85e, 0.9);
        scene.add(hemi);
        sun = new T.DirectionalLight(0xffffff, 1.0);
        sun.position.set(9, 16, 7);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        const s = sun.shadow.camera; s.left = -13; s.right = 13; s.top = 13; s.bottom = -13; s.near = 1; s.far = 50;
        sun.shadow.bias = -0.0015;
        scene.add(sun);
        scene.add(new T.AmbientLight(0xffffff, 0.08));
      }

      function setTimeOfDay() {
        const hr = new Date().getHours();
        tod = (hr >= 5 && hr < 10) ? 'morning' : (hr >= 10 && hr < 17) ? 'day' : (hr >= 17 && hr < 19) ? 'evening' : 'night';
        if (!W.ready && !renderer) return;
        container.setAttribute('data-tod', tod);
        const cfg = {
          morning: [0xffe2c8, 0x8fbf6a, .5, 0xffd6a8, .7, [12, 9, 8]],
          day:     [0xd4f0ff, 0x86b85e, .55, 0xffffff, .72, [8, 16, 7]],
          evening: [0xffc7a2, 0x7f9a5a, .45, 0xff9f6a, .65, [-12, 7, 6]],
          night:   [0x6b78c0, 0x34463a, .55, 0xb8c6ff, .42, [-6, 14, 4]]
        }[tod];
        hemi.color.setHex(cfg[0]); hemi.groundColor.setHex(cfg[1]); hemi.intensity = cfg[2];
        sun.color.setHex(cfg[3]); sun.intensity = cfg[4]; sun.position.set(cfg[5][0], cfg[5][1], cfg[5][2]);
        const night = tod === 'night';
        moonLights.forEach(function (l) { l.visible = night; });
        if (lanternGroup) lanternGroup.children.forEach(function (c) { if (c.material && c.material.emissive) c.material.emissiveIntensity = night ? 1 : 0.05; });
        Object.keys(objects).forEach(function (k) { const o = objects[k]; if (o.glowMat) o.glowMat.emissiveIntensity = night ? 0.9 : 0.15; });
        if (fireflies) fireflies.visible = night;
        if (stars) stars.visible = night;
        clouds.forEach(function (c) { c.children.forEach(function (m) { m.material = night ? mat(0x9aa6cc) : mat(0xffffff); }); });
      }

      // ---------- 섬 ----------
      function buildIsland() {
        const top = new T.CylinderGeometry(10, 9.7, 1.2, 30, 1);
        const p = top.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const x = p.getX(i), z = p.getZ(i), y = p.getY(i);
          const r = Math.sqrt(x * x + z * z);
          if (r > 9) { const k = 1 + (Math.sin(Math.atan2(z, x) * 5) * .025) + (Math.random() - .5) * .03; p.setX(i, x * k); p.setZ(i, z * k); }
          if (y < 0) p.setY(i, y + (Math.random() - .5) * .25);
        }
        top.computeVertexNormals();
        island = mesh(top, flat(0x8fcf6c), 0, -0.6, 0);
        island.castShadow = false;
        root.add(island);
        // 흙·바위 밑면
        const under = jitter(new T.ConeGeometry(9.75, 7.5, 30, 4), .7);
        const u = mesh(under, flat(0xb27c4f), 0, -4.95, 0);
        u.rotation.x = Math.PI; u.castShadow = false;
        root.add(u);
        const under2 = jitter(new T.ConeGeometry(7.2, 5, 20, 2), .6);
        const u2 = mesh(under2, flat(0x8f6040), 0.6, -6.6, -0.4); u2.rotation.x = Math.PI; root.add(u2);
        for (let i = 0; i < 14; i++) {
          const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 3.4;
          const rk = mesh(new T.DodecahedronGeometry(.5 + Math.random() * .7, 0), flat(i % 2 ? 0x9a9284 : 0x857c70), Math.cos(a) * r, -1.6 - Math.random() * 2.4, Math.sin(a) * r);
          rk.rotation.set(Math.random() * 3, Math.random() * 3, 0); root.add(rk);
        }
        // 풀 테두리
        for (let i = 0; i < 46; i++) {
          const a = i / 46 * Math.PI * 2;
          const g = mesh(new T.ConeGeometry(.22, .5, 4), flat(i % 3 ? 0x6fb556 : 0x7fc463), Math.cos(a) * 9.55, .1, Math.sin(a) * 9.55);
          g.rotation.z = (Math.random() - .5) * .4; root.add(g);
        }
        // 오솔길 (책상 → 집)
        [[-0.3, 3.0], [0.2, 2.0], [-0.2, 0.9], [0.25, -0.2], [-0.15, -1.3], [0.2, -2.4], [0, -3.5], [-0.1, -4.4]].forEach(function (s, i) {
          const st = mesh(new T.CylinderGeometry(.42 + (i % 2) * .08, .46, .08, 7), flat(0xd9caa8), s[0], .02, s[1]);
          st.rotation.y = i; st.castShadow = false; root.add(st);
        });
        // 연못
        const pond = mesh(new T.CylinderGeometry(1.25, 1.25, .06, 18), mat(0x7cc6e8, { transparent: true, opacity: .9 }), 3.4, .03, 1.0);
        pond.castShadow = false; root.add(pond);
        const rim = mesh(new T.TorusGeometry(1.3, .14, 5, 18), flat(0xa79f90), 3.4, .05, 1.0); rim.rotation.x = Math.PI / 2; root.add(rim);
        [[3.0, .7], [3.8, 1.4]].forEach(function (lp) {
          const pad = mesh(new T.CylinderGeometry(.24, .24, .03, 8, 1, false, 0, Math.PI * 1.7), flat(0x5fae4f), lp[0], .08, lp[1]); root.add(pad);
        });
        obstacles.push({ x: 3.4, z: 1.0, r: 1.55 });
      }

      // ---------- 나무·꽃·돌 ----------
      function tree(x, z, s, apples) {
        const g = new T.Group();
        g.add(mesh(new T.CylinderGeometry(.16 * s, .24 * s, 1.5 * s, 6), flat(0x9a6a43), 0, .75 * s, 0));
        const c = flat(0x6cb758), c2 = flat(0x7cc566);
        [[0, 2.1, 0, 1.15], [-.55, 1.75, .25, .8], [.55, 1.8, -.2, .85], [.1, 2.65, .1, .75]].forEach(function (b, i) {
          const m = mesh(new T.IcosahedronGeometry(b[3] * s, 0), i % 2 ? c2 : c, b[0] * s, b[1] * s, b[2] * s);
          m.rotation.set(i, i * 2, 0); g.add(m);
        });
        if (apples) {
          for (let i = 0; i < 7; i++) {
            const a = i / 7 * Math.PI * 2;
            g.add(mesh(new T.SphereGeometry(.11 * s, 6, 5), mat(0xe8504a), Math.cos(a) * 1.0 * s, (1.9 + (i % 3) * .3) * s, Math.sin(a) * 1.0 * s));
          }
        }
        g.position.set(x, 0, z); root.add(g);
        obstacles.push({ x: x, z: z, r: .7 * s });
        return g;
      }
      function pine(x, z, s) {
        const g = new T.Group();
        g.add(mesh(new T.CylinderGeometry(.12 * s, .18 * s, .9 * s, 6), flat(0x8a5d3b), 0, .45 * s, 0));
        [[1.05, 1.1, 1.2], [.85, 1.8, 1.0], [.6, 2.4, .8]].forEach(function (c, i) {
          g.add(mesh(new T.ConeGeometry(c[0] * s, c[2] * s, 7), flat(i % 2 ? 0x4f9a52 : 0x5aa95c), 0, c[1] * s, 0));
        });
        g.position.set(x, 0, z); root.add(g);
        obstacles.push({ x: x, z: z, r: .65 * s });
      }
      function flower(x, z, color) {
        const g = new T.Group();
        g.add(mesh(new T.CylinderGeometry(.02, .02, .32, 4), flat(0x4e8f3a), 0, .16, 0, false));
        const h = mesh(new T.DodecahedronGeometry(.09, 0), flat(color), 0, .34, 0, false); g.add(h);
        g.add(mesh(new T.SphereGeometry(.045, 5, 4), flat(0xf6b53d), 0, .37, .05, false));
        g.position.set(x, 0, z); g.userData.sway = Math.random() * 6; root.add(g); groundDeco.push(g);
        return g;
      }
      function rock(x, z, s) {
        const r = mesh(new T.DodecahedronGeometry(.35 * s, 0), flat(0xa39d90), x, .15 * s, z);
        r.scale.y = .7; r.rotation.y = x; root.add(r); return r;
      }
      function tuft(x, z) {
        const g = new T.Group();
        for (let i = 0; i < 3; i++) { const c = mesh(new T.ConeGeometry(.06, .3, 3), flat(0x6aaf52), (i - 1) * .07, .15, (i % 2) * .05, false); c.rotation.z = (i - 1) * .3; g.add(c); }
        g.position.set(x, 0, z); root.add(g); groundDeco.push(g);
      }

      function buildDecor() {
        tree(-7.4, -5.2, 1.15, false); tree(7.7, -4.6, 1.0, false);
        const appleTree = tree(-8.2, 3.6, .95, false); appleTree.userData.apple = true;
        pine(1.8, -8.4, 1.2); pine(-2.6, -8.6, 1.0); pine(8.5, 1.2, .9); pine(4.4, -7.6, .85);
        tree(6.2, 6.4, .85, false);
        rock(-4.4, 6.8, 1.2); rock(8.6, -1.8, .9); rock(-8.9, -1.6, 1); rock(1.0, 7.9, .8);
        const cols = [0xff9eb5, 0xffffff, 0xffe07a, 0xb9a4f5, 0xff8a7a];
        for (let i = 0; i < 26; i++) {
          let x, z, ok = false, n = 0;
          while (!ok && n++ < 30) { const a = Math.random() * 6.28, r = 2 + Math.random() * 7; x = Math.cos(a) * r; z = Math.sin(a) * r; ok = freeSpot(x, z, .5); }
          const f = flower(x, z, cols[i % cols.length]);
          if (i >= 14) { f.visible = false; f.userData.minStage = 2; }
        }
        for (let i = 0; i < 40; i++) { const a = Math.random() * 6.28, r = 1 + Math.random() * 8.4; const x = Math.cos(a) * r, z = Math.sin(a) * r; if (freeSpot(x, z, .3)) tuft(x, z); }
        // 사과 (3단계부터)
        const ap = new T.Group();
        for (let i = 0; i < 8; i++) { const a = i / 8 * 6.28; ap.add(mesh(new T.SphereGeometry(.11, 6, 5), mat(0xe8504a), -8.2 + Math.cos(a) * .95, 1.8 + (i % 3) * .3, 3.6 + Math.sin(a) * .95)); }
        ap.visible = false; root.add(ap); extraDecor.push({ g: ap, stage: 3 });
        // 랜턴 줄 (4단계부터, 밤에 켜짐)
        lanternGroup = new T.Group();
        [[-4.8, 5.8], [4.6, 6.6], [-6.8, -2.6], [6.9, 2.6]].forEach(function (l, i) {
          lanternGroup.add(mesh(new T.CylinderGeometry(.05, .06, 1.6, 5), flat(0x6e4b33), l[0], .8, l[1]));
          const lm = new T.MeshLambertMaterial({ color: 0xffe2a0, emissive: 0xffc861, emissiveIntensity: .05 });
          lanternGroup.add(mesh(new T.BoxGeometry(.28, .32, .28), lm, l[0], 1.7, l[1]));
          const pl = new T.PointLight(0xffc477, .8, 5, 2); pl.position.set(l[0], 1.7, l[1]); pl.visible = false;
          moonLights.push(pl); lanternGroup.add(pl);
        });
        lanternGroup.visible = false; root.add(lanternGroup); extraDecor.push({ g: lanternGroup, stage: 4 });
        // 무지개 (5단계)
        rainbow = new T.Group();
        [0xff8f9a, 0xffb27a, 0xffe48a, 0x9fe0a7, 0x8fc7f2, 0xb79cf0].forEach(function (c, i) {
          const tr = new T.Mesh(new T.TorusGeometry(7.5 - i * .32, .16, 6, 40, Math.PI), new T.MeshBasicMaterial({ color: c, transparent: true, opacity: .55 }));
          rainbow.add(tr);
        });
        rainbow.position.set(0, -.5, -9.5); rainbow.visible = false; root.add(rainbow); extraDecor.push({ g: rainbow, stage: 5 });
        // 반짝이 (5단계)
        const sp = new T.Group();
        for (let i = 0; i < 18; i++) { const s = mesh(new T.OctahedronGeometry(.09, 0), new T.MeshBasicMaterial({ color: 0xffe27a }), (Math.random() - .5) * 16, 1 + Math.random() * 4, (Math.random() - .5) * 16, false); s.userData.f = Math.random() * 6; sp.add(s); }
        sp.visible = false; root.add(sp); extraDecor.push({ g: sp, stage: 5 }); sparkles = sp.children;
        // 반딧불 (밤)
        const fg = new T.BufferGeometry(); const fp = [];
        for (let i = 0; i < 40; i++) fp.push((Math.random() - .5) * 18, .4 + Math.random() * 2.5, (Math.random() - .5) * 18);
        fg.setAttribute('position', new T.Float32BufferAttribute(fp, 3));
        fireflies = new T.Points(fg, new T.PointsMaterial({ color: 0xfff59a, size: .16, transparent: true, opacity: .9 }));
        fireflies.visible = false; root.add(fireflies);
      }

      function freeSpot(x, z, pad) {
        if (Math.sqrt(x * x + z * z) > 8.8) return false;
        for (let i = 0; i < obstacles.length; i++) { const o = obstacles[i]; const dx = x - o.x, dz = z - o.z; if (dx * dx + dz * dz < (o.r + pad) * (o.r + pad)) return false; }
        if (Math.abs(x) < .7 && z > -4.6 && z < 3.4) return false; // 길
        return true;
      }

      function buildSky() {
        for (let i = 0; i < 7; i++) {
          const c = new T.Group();
          const n = 3 + (i % 3);
          for (let k = 0; k < n; k++) {
            const s = new T.Mesh(new T.IcosahedronGeometry(.9 + Math.random() * .7, 1), mat(0xffffff, { flatShading: true }));
            s.position.set(k * 1.1 - n * .5, Math.random() * .4, (Math.random() - .5) * .8); s.scale.y = .7; c.add(s);
          }
          c.userData = { a: i / 7 * Math.PI * 2, r: 15 + (i % 3) * 3, y: -2 + (i % 4) * 2.2, sp: .015 + (i % 3) * .006 };
          scene.add(c); clouds.push(c);
        }
        // 작은 떠 있는 섬
        [[-15, -3, -8, 1.2], [14, -5, 6, .9], [6, -8, -16, 1.4]].forEach(function (s) {
          const g = new T.Group();
          g.add(mesh(new T.CylinderGeometry(1.4 * s[3], 1.3 * s[3], .4, 9), flat(0x8fcf6c), 0, 0, 0));
          const c = mesh(jitter(new T.ConeGeometry(1.35 * s[3], 1.8 * s[3], 9, 1), .25), flat(0xb27c4f), 0, -.2 - .9 * s[3], 0); c.rotation.x = Math.PI; g.add(c);
          g.add(mesh(new T.IcosahedronGeometry(.5 * s[3], 0), flat(0x6cb758), .2, .6 * s[3], 0));
          g.position.set(s[0], s[1], s[2]); g.userData.float = Math.random() * 6; scene.add(g); clouds.push(g);
        });
        const sg = new T.BufferGeometry(); const spos = [];
        for (let i = 0; i < 260; i++) { const a = Math.random() * 6.28, b = Math.random() * 1.2 + .15, r = 70; spos.push(Math.cos(a) * Math.cos(b) * r, Math.sin(b) * r, Math.sin(a) * Math.cos(b) * r); }
        sg.setAttribute('position', new T.Float32BufferAttribute(spos, 3));

      }

      // ---------- 캔버스 텍스처 ----------

        draw(cv.getContext('2d'), w, h);

      // ---------- 사물 ----------
      function addObject(key, label, emoji, group, x, z, rotY, anchorY, radius) {

        group.userData.key = key;
        root.add(group);
        group.traverse(function (m) { if (m.isMesh) { m.userData.key = key; pickables.push(m); } });
        const dirx = -Math.sin(rotY) * -1, dirz = Math.cos(rotY);
        const ap = { x: x + Math.sin(rotY) * (radius + .75), z: z + Math.cos(rotY) * (radius + .75) };
        const el = document.createElement('button');
        el.type = 'button'; el.className = 'w-label'; el.setAttribute('data-key', key);
        el.innerHTML = '<span class="w-label-emoji">' + emoji + '</span><span class="w-label-text">' + label + '</span><span class="w-label-badge"></span><span class="w-label-key">Space</span>';
        el.onclick = function (ev) { ev.stopPropagation(); if (EDIT.on) return; W.activate(key); };
        labelLayer.appendChild(el);
        const ob = { x: x, z: z, r: radius, key: key };
        objects[key] = { group: group, anchorY: anchorY, label: el, approach: ap, face: rotY + Math.PI, hover: 0, ob: ob, def: { x: x, z: z, rot: rotY } };
        obstacles.push(ob);
        return objects[key];
      }

        const lidm = mesh(new T.CylinderGeometry(.26, .26, .72, 10, 1, false, 0, Math.PI), flat(0xe2574c), 0, 1.34, 0); lidm.rotation.x = Math.PI / 2; lidm.rotation.z = Math.PI / 2; g.add(lidm);
        g.add(mesh(new T.BoxGeometry(.4, .3, .02), flat(0x3b2f2a), 0, 1.15, .37));

        flag.add(mesh(new T.BoxGeometry(.03, .5, .03), flat(0x555555), 0, .25, 0));
        flag.add(mesh(new T.BoxGeometry(.03, .16, .24), flat(0xffd34d), 0, .44, .12));
        g.add(flag);
        const mb = addObject('mailbox', '우편함', '📮', g, -3.4, -3.6, .35, 1.9, .5); mb.flag = flag;

        // 📌 게시판 (학습방)
        g = new T.Group();
        g.add(mesh(new T.CylinderGeometry(.07, .08, 1.9, 6), woodD, -.85, .95, 0)); g.add(mesh(new T.CylinderGeometry(.07, .08, 1.9, 6), woodD, .85, .95, 0));

          const er = [0, .15, .16, .18, .19, .19][stage];

            head.add(ball(er, S.body, s * .43, .46, -.05));
            head.add(ball(er * .6, S.muzzle, s * .43, .46, .07, 1, 1, .4));
            head.add(ball(er * .75, S.stripe, s * .43, .48, -.14, 1, 1, .4));
          });
        } else if (species === 'quokka') {
          const er = [0, .13, .14, .15, .16, .16][stage];
          [-1, 1].forEach(function (sd) {
            const ear = new T.Group(); ear.position.set(sd * .4, .44, -.02); ear.rotation.z = -sd * .35;
            ear.add(ball(er, S.rim, 0, 0, 0, 1, 1, .55));
            ear.add(ball(er * .78, S.body, 0, 0, .02, 1, 1, .5));
            ear.add(ball(er * .5, S.accent, 0, 0, .05, 1, 1, .3));
            head.add(ear);
          });
        } else {
          const er = [0, .18, .19, .21, .23, .23][stage];
          [-1, 1].forEach(function (s) { head.add(ball(er, S.body, s * .45, .45, -.05)); head.add(ball(er * .55, S.muzzle, s * .45, .45, .08, 1, 1, .4)); });
        }
        // 팔
        const armLen = 1.5 + (stage >= 3 ? .25 : 0) + (adult ? .15 : 0);
        const armL = ball(.13, S.body, -.45 * tSX, cy + .07, .1, 1, armLen, 1), armR = ball(.13, S.body, .45 * tSX, cy + .07, .1, 1, armLen, 1);
        armL.rotation.z = .5; armR.rotation.z = -.5; body.add(armL); body.add(armR);
        if (qk) {
          [[armL, -1], [armR, 1]].forEach(function (q) {
            const a = q[0], sd = q[1];
            a.position.set(sd * .17, cy + ry * .3, .38 * tSX); a.rotation.set(-1.0, 0, -sd * .35); a.scale.set(.9, 1.1, .9); a.userData.rx = -1.0;
            a.add(ball(.07, S.paw, 0, -.12, 0, 1.2, .8, 1));
          });
        }
        // 다리·발 (청소년부터 다리가 보여요)
        const sockC = species === 'fox' && stage >= 3 ? S.tip : (species === 'cat' ? S.belly : S.body);
        const mkFoot = function (x) {
          const f = new T.Group(); f.position.set(x, 0, .06);
          f.add(ball(.17 * (adult ? 1.12 : 1), qk ? S.paw : sockC, 0, .1, qk ? .08 : 0, qk ? .85 : 1, .55, qk ? 1.9 : 1.3));
          if (legH > 0) f.add(mesh(new T.CylinderGeometry(.11 * tSX, .12, legH + .14, 10), sm(sockC), 0, .12 + (legH + .14) / 2, -.04));
          g.add(f); return f;
        };
        const footL = mkFoot(-.22), footR = mkFoot(.22);
        parts.footL = footL; parts.footR = footR; parts.armL = armL; parts.armR = armR;
        // 몸 무늬 (어른)
        if (species === 'tiger' && stage >= 2) {
          const n = adult ? 4 : 3;
          for (let i = 0; i < n; i++) { const z = (i - (n - 1) / 2) * (adult ? .2 : .25); const st = mesh(new T.TorusGeometry(.43 * tSX, .035, 4, 16, Math.PI * .65), sm(S.stripe), 0, cy + z * .6 + .05, -.06); st.rotation.y = Math.PI / 2; st.rotation.z = Math.PI * .67; body.add(st); }
          if (adult) body.add(ball(.2, S.belly, 0, cy + ry * .5, .38 * tSX, 1, .9, .6));
        }
        if (adult && species === 'wolf') {
          const ruff = mesh(new T.ConeGeometry(.26, .42, 8), sm(S.belly), 0, cy + ry * .45, .3 * tSX); ruff.rotation.x = Math.PI + .25; body.add(ruff);
          body.add(ball(.42, S.tip, 0, cy + .12, -.2, 1.05 * tSX, .7, .8));
        }
        if (adult && species === 'quokka') body.add(ball(.2, S.belly, 0, cy + ry * .45, .34 * tSX, 1.1, .8, .6));
        if (species === 'cat' && stage >= 2) { (adult ? [-.25, 0, .25] : [-.15, .15]).forEach(function (z) { const st = mesh(new T.TorusGeometry(.42 * tSX, .028, 4, 16, Math.PI * .6), sm(S.stripe), 0, cy + z * .5 + .05, -.06); st.rotation.y = Math.PI / 2; st.rotation.z = Math.PI * .7; body.add(st); }); }
        if (adult && species === 'bear') { const moon = mesh(new T.TorusGeometry(.17, .045, 6, 14, Math.PI), sm(0xf6ead6), 0, cy + ry * .5, .44 * tSX); moon.rotation.z = Math.PI; body.add(moon); }
        if (adult && species === 'fox') { const ruff = mesh(new T.ConeGeometry(.24, .4, 8), sm(S.belly), 0, cy + ry * .45, .3 * tSX); ruff.rotation.x = Math.PI + .25; body.add(ruff); }
        // 꼬리 (자랄수록 커져요)
        const tg = [0, .85, .95, 1.1, 1.25, 1.3][stage];
        if (qk) { const qt = mesh(new T.ConeGeometry(.12 * tg, .5 * tg, 8), sm(S.body), 0, .14, -.62 * tSX); qt.rotation.x = -1.75; body.add(qt); }
        if (species === 'tiger') {
          // 고리 무늬가 있는 긴 꼬리
          const k = tg * .62, y0 = cy - .18;
          const curve = new T.CatmullRomCurve3([new T.Vector3(0, y0, -.42 * tSX), new T.Vector3(0, y0 - .04, -.42 - .32 * k), new T.Vector3(0, y0 + .22 * k, -.42 - .5 * k), new T.Vector3(0, y0 + .45 * k, -.42 - .42 * k)]);
          const tail = new T.Group();
          for (let i = 0; i <= 7; i++) { const pt = curve.getPoint(i / 7); tail.add(ball(.085 - i * .002, i === 7 || i % 3 === 2 ? S.stripe : S.body, pt.x, pt.y, pt.z)); }
          body.add(tail); parts.tail = tail;
        }
        if (species === 'bear') body.add(ball(.12 * tg, S.body, 0, cy - .13, -.48 * tSX));
        if (species === 'cat') {
          const k = tg, y0 = cy - .15;
          const curve = new T.CatmullRomCurve3([new T.Vector3(0, y0, -.42 * tSX), new T.Vector3(0, y0 - .05, -.42 - .33 * k), new T.Vector3(0, y0 + .3 * k, -.42 - .48 * k), new T.Vector3(0, y0 + .6 * k, -.42 - .33 * k)]);
          const tail = mesh(new T.TubeGeometry(curve, 16, .08, 8), sm(S.body)); body.add(tail); parts.tail = tail;
          if (stage >= 3) body.add(ball(.09, S.stripe, 0, y0 + .6 * k, -.42 - .33 * k));
        }
        if (species === 'fox' || species === 'wolf') {
          const wolf = species === 'wolf';
          const tail = new T.Group(); tail.position.set(0, cy - (wolf ? .05 : 0), -.5 * tSX); tail.rotation.x = (wolf ? -.45 : -.9) + (stage >= 3 ? .15 : 0);
          const ts = tg;
          tail.add(ball(.26 * ts, S.body, 0, 0, -.3 * ts, 1, 1, 1.9));
          tail.add(ball(.17 * ts, wolf ? S.tip : S.belly, 0, 0, -.72 * ts, 1, 1, 1.1));
          body.add(tail); parts.tail = tail;
        }
        // 단계별 장식
        if (stage === 2 || stage === 3) {
          const sprout = new T.Group(); sprout.position.y = .56;
          const big = stage === 3 ? 1.25 : 1;
          sprout.add(mesh(new T.CylinderGeometry(.02, .025, .25 * big, 5), sm(0x4e8f3a), 0, .12 * big, 0));
          const l1 = ball(.1 * big, 0x7cc35f, -.1 * big, .26 * big, 0, 1.4, .45, .8); l1.rotation.z = .4; sprout.add(l1);
          const l2 = ball(.1 * big, 0x8fd06f, .1 * big, .28 * big, 0, 1.4, .45, .8); l2.rotation.z = -.4; sprout.add(l2);
          head.add(sprout); parts.sprout = sprout;
        }
        if (stage === 3 || stage === 4) {
          const ny = cy + ry - .05;
          const scarf = mesh(new T.TorusGeometry(.4 * tSX, .1, 8, 18), sm(0xe46a6a), 0, ny, 0); scarf.rotation.x = Math.PI / 2; scarf.scale.set(1.05, 1, 1); body.add(scarf);
          const tailS = mesh(new T.BoxGeometry(.16, .34, .07), sm(0xe46a6a), .18, ny - .17, .4 * tSX); tailS.rotation.z = .2; body.add(tailS);
        }
        if (stage === 4) {
          // 꽃 화관: 머리 위를 한 바퀴 두르는 큼직한 꽃
          const cols = [0xff9eb5, 0xffe07a, 0xffffff, 0xb9a4f5, 0xff8a7a];
          const ring = new T.Group(); ring.position.y = .4; ring.rotation.x = -.18;
          ring.add(mesh(new T.TorusGeometry(.5, .035, 6, 24), sm(0x6cb758), 0, 0, 0)).rotation.x = Math.PI / 2;
          for (let i = 0; i < 9; i++) {
            const a = i / 9 * Math.PI * 2;
            const fl = new T.Group(); fl.position.set(Math.cos(a) * .5, .02, Math.sin(a) * .5);
            for (let k = 0; k < 5; k++) { const pa = k / 5 * Math.PI * 2; fl.add(mesh(new T.SphereGeometry(.055, 6, 5), sm(cols[i % 5]), Math.cos(pa) * .06, .03, Math.sin(pa) * .06)); }
            fl.add(mesh(new T.SphereGeometry(.04, 6, 5), sm(0xf6b53d), 0, .05, 0));
            ring.add(fl);
          }
          head.add(ring);
        }
        if (stage === 5) {
          const crown = new T.Group(); crown.position.y = .58;
          const gold = mat(0xffd34d, { emissive: 0xc98a1f, emissiveIntensity: .25 });
          crown.add(mesh(new T.CylinderGeometry(.26, .28, .14, 10, 1, true), gold, 0, 0, 0));
          for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; crown.add(mesh(new T.ConeGeometry(.06, .18, 4), gold, Math.cos(a) * .25, .14, Math.sin(a) * .25)); }
          crown.add(ball(.05, 0xe2557a, 0, .02, .27));
          head.add(crown);
          const glow = new T.PointLight(0xffe27a, .9, 4, 2); glow.position.set(0, 1.2, .5); g.add(glow);
          const halo = new T.Mesh(new T.RingGeometry(.7, .95, 32), new T.MeshBasicMaterial({ color: 0xffe27a, transparent: true, opacity: .35, side: T.DoubleSide }));
          halo.rotation.x = -Math.PI / 2; halo.position.y = .03; g.add(halo); parts.halo = halo;
          // 반짝이는 별 3개가 머리 위를 맴돌아요
          const orbit = new T.Group(); orbit.position.y = cy + ry + .9;
          for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2; orbit.add(mesh(new T.OctahedronGeometry(.07, 0), new T.MeshBasicMaterial({ color: 0xffe27a }), Math.cos(a) * .75, 0, Math.sin(a) * .75, false)); }
          g.add(orbit); parts.orbit = orbit;
        }
        g.scale.setScalar(STAGE_SCALE[stage]);
        return parts;
      }


      // 늑대 털: 빛을 받으면 반짝이는 은빛
      const silverCache = {};
      function silverize(g, colors) {
        g.traverse(function (m) {
          if (!m.isMesh || !m.material || !m.material.color || m.material.isMeshBasicMaterial) return;
          const hex = m.material.color.getHex();
          if (colors.indexOf(hex) < 0) return;
          m.material = silverCache[hex] || (silverCache[hex] = new T.MeshPhongMaterial({ color: hex, specular: 0x8e939a, shininess: 50 }));
        });
      }

      // ---------- 🐥 병아리 → 🐔 닭 (새는 몸 구조가 달라서 따로 만들어요) ----------
      function buildBird(stage) {
        const S = SPC.chick;
        const g = new T.Group();
        const body = new T.Group(); g.add(body);
        const parts = { g: g, body: body };
        const legH = [0, 0, 0, .12, .22, .22][stage];
        const br = [0, .46, .5, .5, .52, .52][stage];
        const hr = [0, .42, .42, .37, .34, .34][stage];
        const eyeS = [0, 1.15, 1.08, 1.0, .9, .9][stage];
        const col = [0, S.chick, S.chick, S.teen, S.body, S.body][stage];
        const bel = [0, S.chickBelly, S.chickBelly, S.teenBelly, S.belly, S.belly][stage];
        const adult = stage >= 4;
        const sy = stage >= 4 ? .88 : (stage === 3 ? .92 : 1), sz = stage >= 4 ? 1.22 : (stage === 3 ? 1.1 : 1);
        const cy = .1 + legH + br * sy;
        body.add(ball(br, col, 0, cy, 0, 1, sy, sz));
        body.add(ball(br * .7, bel, 0, cy - br * .15, br * .45, 1, sy * .9, .6));
        // 머리 (병아리는 몸에 붙어 있고, 자라면 목이 생겨요)
        const head = new T.Group();
        head.position.set(0, cy + br * sy * .72 + hr * .55 + (adult ? .14 : (stage === 3 ? .06 : 0)), stage >= 3 ? .1 : 0);
        body.add(head); parts.head = head;
        if (stage >= 3) body.add(ball(hr * .8, col, 0, (cy + head.position.y) / 2 + .04, .06, 1, 1.3, 1));
        head.add(ball(hr, col, 0, 0, 0));
        // 눈
        const eyeM = sm(0x2a2220), hiM = sm(0xffffff), eyes = [];
        [-1, 1].forEach(function (sd) {
          const e = new T.Group(); e.position.set(sd * hr * .42, hr * .14, hr * .86);
          const eb = new T.Group(); eb.scale.setScalar(eyeS); e.add(eb);
          eb.add(mesh(new T.SphereGeometry(.07, 12, 10), eyeM, 0, 0, 0)); eb.children[0].scale.set(1, 1.2, .6);
          eb.add(mesh(new T.SphereGeometry(.024, 6, 5), hiM, .022, .035, .04));
          head.add(e); eyes.push(e);
        });
        parts.eyes = eyes;
        const brows = new T.Group();
        [-1, 1].forEach(function (sd) { const b = mesh(new T.BoxGeometry(.12, .022, .02), eyeM, sd * hr * .42, hr * .42, hr * .86); b.rotation.z = -sd * .35; brows.add(b); });
        brows.visible = false; head.add(brows); parts.brows = brows;
        if (stage <= 3) [-1, 1].forEach(function (sd) { head.add(ball(.08, S.blush, sd * hr * .7, -hr * .18, hr * .7, 1, .6, .4)); });
        // 부리
        const bk = adult ? 1.15 : 1;
        const beakT = mesh(new T.ConeGeometry(.075 * bk, .16 * bk, 6), sm(S.beak), 0, -hr * .05, hr + .05); beakT.rotation.x = Math.PI / 2; beakT.scale.set(1.2, 1, .7); head.add(beakT);
        // 볏·턱볏 (자랄수록 커져요)
        const combN = [0, 0, 1, 3, 4, 4][stage], combR = [0, 0, .06, .07, .085, .09][stage];
        for (let i = 0; i < combN; i++) {
          const t = combN === 1 ? 0 : i / (combN - 1);
          head.add(ball(combR * (1 - Math.abs(t - .35) * .4), S.comb, 0, hr * .92 + combR * .5, hr * (.45 - t * .7), .7, 1.1, 1));
        }
        if (adult) [-1, 1].forEach(function (sd) { head.add(ball(.05, S.comb, sd * .035, -hr * .45, hr * .78, .8, 1.4, .6)); });
        // 날개 (팔 역할)
        const mkWing = function (sd) {
          const w = ball(.2, col, sd * br * .95, cy, -.02, .35, .8 * sy, 1.1 * sz);
          w.rotation.z = sd * .25;
          if (adult) w.add(ball(.11, S.feather, 0, -.12, -.12, 1.1, .7, 1));
          body.add(w); return w;
        };
        parts.armL = mkWing(-1); parts.armR = mkWing(1);
        // 꽁지깃
        const tail = new T.Group(); tail.position.set(0, cy + br * .2, -br * sz * .85);
        if (stage <= 2) { const tf = mesh(new T.ConeGeometry(.08, .2, 6), sm(col), 0, .05, -.04); tf.rotation.x = -.9; tail.add(tf); }
        else {
          const n = stage === 3 ? 3 : 5, len = stage === 3 ? .32 : .5;
          for (let i = 0; i < n; i++) {
            const a = (i - (n - 1) / 2) * .32;
            const f = new T.Group(); f.rotation.set(-.55, 0, a);
            f.add(ball(.09, col, 0, len * .5, 0, .7, len * 5.2, .4));
            if (stage >= 4) f.add(ball(.07, stage === 5 ? 0xffc93c : S.feather, 0, len * .95, 0, .7, 1.6, .4));
            tail.add(f);
          }
        }
        body.add(tail); parts.tail = tail;
        // 다리·발 (주황색)
        const mkFoot = function (x) {
          const f = new T.Group(); f.position.set(x, 0, .05);
          const legLen = legH + .14;
          f.add(mesh(new T.CylinderGeometry(.035, .04, legLen, 6), sm(S.beak), 0, .06 + legLen / 2, 0));
          [-.35, 0, .35].forEach(function (a) { const toe = mesh(new T.BoxGeometry(.035, .03, .14), sm(S.beak), Math.sin(a) * .06, .03, .06 + Math.cos(a) * .02); toe.rotation.y = a; f.add(toe); });
          g.add(f); return f;
        };
        parts.footL = mkFoot(-.15); parts.footR = mkFoot(.15);
        // 단계별 장식 (다른 친구들과 같아요)
        if (stage === 2 || stage === 3) {
          const sprout = new T.Group(); sprout.position.set(0, hr * .95, -hr * .35);
          sprout.add(mesh(new T.CylinderGeometry(.02, .025, .22, 5), sm(0x4e8f3a), 0, .11, 0));
          const l1 = ball(.09, 0x7cc35f, -.09, .24, 0, 1.4, .45, .8); l1.rotation.z = .4; sprout.add(l1);
          const l2 = ball(.09, 0x8fd06f, .09, .25, 0, 1.4, .45, .8); l2.rotation.z = -.4; sprout.add(l2);
          head.add(sprout);
        }
        if (stage === 3 || stage === 4) {
          const ny = head.position.y - hr * .85;
          const scarf = mesh(new T.TorusGeometry(hr * .85, .08, 8, 18), sm(0xe46a6a), 0, ny, head.position.z * .6); scarf.rotation.x = Math.PI / 2; body.add(scarf);
          const ts = mesh(new T.BoxGeometry(.14, .3, .06), sm(0xe46a6a), .14, ny - .15, head.position.z * .6 + hr * .8); ts.rotation.z = .2; body.add(ts);
        }
        if (stage === 4) {
          const cols = [0xff9eb5, 0xffe07a, 0xb9a4f5, 0xff8a7a, 0x9fd8f0];
          const ring = new T.Group(); ring.position.y = hr * .72; ring.rotation.x = -.15;
          ring.add(mesh(new T.TorusGeometry(hr * .95, .03, 6, 24), sm(0x6cb758), 0, 0, 0)).rotation.x = Math.PI / 2;
          for (let i = 0; i < 9; i++) {
            const a = i / 9 * Math.PI * 2, fl = new T.Group(); fl.position.set(Math.cos(a) * hr * .95, .02, Math.sin(a) * hr * .95);
            for (let k = 0; k < 5; k++) { const pa = k / 5 * Math.PI * 2; fl.add(mesh(new T.SphereGeometry(.045, 6, 5), sm(cols[i % 5]), Math.cos(pa) * .05, .03, Math.sin(pa) * .05)); }
            fl.add(mesh(new T.SphereGeometry(.033, 6, 5), sm(0xf6b53d), 0, .05, 0));
            ring.add(fl);
          }
          head.add(ring);
        }
        if (stage === 5) {
          const crown = new T.Group(); crown.position.set(0, hr * .98, -hr * .2);
          const gold = mat(0xffd34d, { emissive: 0xc98a1f, emissiveIntensity: .25 });
          crown.add(mesh(new T.CylinderGeometry(.2, .22, .12, 10, 1, true), gold, 0, 0, 0));
          for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; crown.add(mesh(new T.ConeGeometry(.05, .15, 4), gold, Math.cos(a) * .2, .12, Math.sin(a) * .2)); }
          head.add(crown);
          const glow = new T.PointLight(0xffe27a, .9, 4, 2); glow.position.set(0, 1.2, .5); g.add(glow);
          const halo = new T.Mesh(new T.RingGeometry(.7, .95, 32), new T.MeshBasicMaterial({ color: 0xffe27a, transparent: true, opacity: .35, side: T.DoubleSide }));
          halo.rotation.x = -Math.PI / 2; halo.position.y = .03; g.add(halo); parts.halo = halo;
          const orbit = new T.Group(); orbit.position.y = head.position.y + .75;
          for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2; orbit.add(mesh(new T.OctahedronGeometry(.07, 0), new T.MeshBasicMaterial({ color: 0xffe27a }), Math.cos(a) * .75, 0, Math.sin(a) * .75, false)); }
          g.add(orbit); parts.orbit = orbit;
        }
        g.scale.setScalar(STAGE_SCALE[stage]);
        return parts;
      }

      function setPetModel(species, stage) {
        if (pet && pet.species === species && pet.stage === stage) return;
        if (pet) root.remove(pet.parts.g);
        const parts = buildPet(species, stage);
        root.add(parts.g);
        pet = { parts: parts, species: species, stage: stage };
        parts.g.traverse(function (m) { if (m.isMesh) { m.userData.key = '__pet'; } });
        placePet();
      }
      function placePet() {
        if (!pet) return;
        pet.parts.g.position.set(P.x, 0, P.z);
        pet.parts.g.rotation.y = P.dir;
      }

      // ---------- 외부 API ----------
      W.setMode = function (mode) {
        W.mode = mode;
        document.body.setAttribute('data-wmode', mode);
        if (!W.ready) return;
        CAM.auto = mode !== 'home';
        if (mode !== 'home') { W.focus(false); hideBubble(); if (EDIT.on) W.stopEdit(false); W.visiting = null; }
        if (mode === 'login' || mode === 'loading') {
          if (!pet || W.home) { setPetModel('tiger', 2); }
          W.home = null; setStageDecor(2);
          Object.keys(objects).forEach(function (k) { setBadge(k, ''); });
          if (food) food.visible = false;
        }
      };

      // info: {species, stage, mood:{sad}, food, mail, study, words, feedback, bonus, wroteToday, greet}
      W.setHome = function (info) {
        const first = !W.home;
        W.home = info;
        if (!W.ready || W.visiting) return;
        if (!P.evolving) setPetModel(info.species, info.stage);
        setStageDecor(info.stage);
        setBadge('mailbox', info.mail > 0 ? info.mail : '');
        if (objects.mailbox) objects.mailbox.flag.rotation.z = info.mail > 0 ? 0 : -Math.PI / 2;

      return pick(lines);

    // ---------- 교사 화면 학생 목록: 일지를 쓴 학생 + 가입만 한 학생 ----------
    function accountsInClass_(cls) {
      return (STATE.studentAccounts || []).filter(function (a) { return (a.className || '미지정') === cls; });
    }
    function allClassNames() {
      const fromEntries = STATE.entries.map(function (e) { return e.className || '미지정'; });
      const fromAccounts = (STATE.studentAccounts || []).map(function (a) { return a.className || '미지정'; });
      return Array.from(new Set(STATE.classes.concat(fromEntries, fromAccounts))).sort(function (a, b) { return a.localeCompare(b, 'ko'); });
    }
    function rosterForClass(cls) {
      const byName = {};
      STATE.entries.filter(function (e) { return (e.className || '미지정') === cls; }).forEach(function (e) {
        if (!byName[e.studentName] || (typeof e.studentNumber === 'number' && byName[e.studentName].number == null)) {
          byName[e.studentName] = { name: e.studentName, number: (typeof e.studentNumber === 'number' ? e.studentNumber : null) };
        }
      });
      accountsInClass_(cls).forEach(function (a) {
        const n = Number(a.studentNumber);
        if (!byName[a.studentName]) byName[a.studentName] = { name: a.studentName, number: isNaN(n) ? null : n };
        else if (byName[a.studentName].number == null && !isNaN(n)) byName[a.studentName].number = n;
      });
      return Object.values(byName).sort(function (a, b) {
        if (a.number != null && b.number != null) return a.number - b.number;
        if (a.number != null) return -1;
        if (b.number != null) return 1;
        return a.name.localeCompare(b.name, 'ko');
      });
    }
    function studentNumberInClass(cls, name) {
      const entry = STATE.entries.find(function (e) { return (e.className || '미지정') === cls && e.studentName === name && typeof e.studentNumber === 'number'; });
      if (entry) return entry.studentNumber;
      const acc = accountsInClass_(cls).find(function (a) { return a.studentName === name; });
      return acc && !isNaN(Number(acc.studentNumber)) ? Number(acc.studentNumber) : null;
    }
    // 교사 화면에 들어오면 가입한 학생 목록을 (1분마다) 새로 받아와요
    function refreshTeacherAccounts() {
      if (STATE.accountsFetching) return;
      if (STATE.accountsFetchedAt && Date.now() - STATE.accountsFetchedAt < 60000) return;
      STATE.accountsFetching = true;
      gsRun('listStudentAccounts').then(function (list) {
        STATE.studentAccounts = Array.isArray(list) ? list : [];
        STATE.accountsFetchedAt = Date.now(); STATE.accountsFetching = false;
        if (document.body.getAttribute('data-screen') === 'teacher') render();
      }).catch(function () { STATE.accountsFetching = false; STATE.accountsFetchedAt = Date.now(); });
    }

    // ---------- 화면 그리기 ----------
    function render() {
      const app = document.getElementById('app');
      const scr = STATE.loading ? 'loading' : STATE.screen;
      const mode = scr === 'studentHome' ? 'home'
        : (scr === 'loading' ? 'loading'
        : ((scr === 'role' || scr === 'teacherPassword') ? 'login' : 'teacher'));
      if (mode !== 'home') { STATE.studentPanel = null; STATE.adoptSel = null; }
      if (mode === 'home' && !loadPet(STATE.studentClass, STATE.studentNumber)) STATE.studentPanel = 'adopt';
      document.body.setAttribute('data-screen', mode);
      document.body.setAttribute('data-tod-ui', (function () { const h = new Date().getHours(); return (h >= 19 || h < 5) ? 'night' : 'day'; })());
      WORLD.setMode(mode);
      if (STATE.loading) app.innerHTML = loadingHtml();
      else if (STATE.screen === 'role') app.innerHTML = roleHtml();
      else if (STATE.screen === 'teacherPassword') app.innerHTML = teacherPasswordHtml();
      else if (STATE.screen === 'studentHome') app.innerHTML = studentHomeHtml();
      else if (STATE.screen === 'teacherClassSelect') app.innerHTML = teacherClassSelectHtml();
      else if (STATE.screen === 'teacherAccounts') app.innerHTML = teacherAccountsHtml();
      else if (STATE.screen === 'teacherHome') app.innerHTML = teacherBossCardHtml(STATE.selectedClass) + teacherHomeHtml();
      else if (STATE.screen === 'teacherDetail') app.innerHTML = teacherDetailHtml();
      bindEvents();
      bindGame();
      if (mode === 'teacher') { refreshTeacherAccounts(); loadBossAttacks(); }
      if (mode !== 'teacher' && mode !== 'loading') STATE.accountsFetchedAt = 0;
      if (mode !== 'home') STATE.visit = null;
      if (STATE.visit) document.body.setAttribute('data-visit', '1'); else document.body.removeAttribute('data-visit');
      if (mode === 'home' && STATE.visit) {
        WORLD.setVisit(STATE.visit);
        WORLD.setBoss(bossFor(STATE.studentClass));
        WORLD.focus(false); WORLD.setOffset(0, 0);
      } else if (mode === 'home') {
        WORLD.setVisit(null);
        const c = gameCtx();
        WORLD.setHome({
          species: c.pet.species, stage: (STATE.studentPanel === 'adopt' && c.stage === 0) ? 2 : c.stage, mood: c.mood, wroteToday: c.wroteToday,
          food: c.wroteToday && !c.fed, mail: c.mail, study: c.study, words: c.words, feedback: c.feedback, bonus: c.bonus,
          greet: STATE.studentPanel === 'adopt' ? '' : petLine('greet')
        });
        if (WORLD.ready && !WORLD.isEditing()) { const rec = loadLayoutRec(); WORLD.setLayout(rec ? rec.layout : null, c.pet.name); }
        if (WORLD.ready) {
          if (STATE.studentPanel === 'decorate' && !WORLD.isEditing()) WORLD.startEdit();
          if (STATE.studentPanel !== 'decorate' && WORLD.isEditing()) WORLD.stopEdit(false);
        }
        syncIslandLayoutFromServer();

        WORLD.focus(STATE.studentPanel === 'pet' || STATE.studentPanel === 'adopt');

        WORLD.setOffset(STATE.studentPanel && wide ? 250 : 0, STATE.studentPanel && !wide ? Math.round(window.innerHeight * .27) : 0);
      } else { WORLD.setOffset(0, 0); WORLD.setBoss && WORLD.setBoss(null); }
    }

        const b = bossFor(STATE.studentClass);

        body += '<div style="text-align:center;font-size:12.5px;color:var(--ej-ink-soft);margin-bottom:12px">' + esc(STATE.studentClass) + ' · ' + b.week.mon.slice(5).replace('-', '/') + ' ~ ' + b.week.sun.slice(5).replace('-', '/') + ' · ' + timeLeftLabel_(b.week.endsAt) + '</div>';

        else {
          const todayAtk = myBossAttackToday();

          '<span>⚔️ 보스 단어 대결 (하루 1번)</span><b>최대 -' + QUIZ_RULES.maxDmg + '</b>' +
          '<span>📖 일지 쓰기 (하루 1번까지)</span><b>-' + BOSS_RULES.entry + '</b><span>🎮 단어 게임 만점</span><b>-' + BOSS_RULES.game + '</b><span>💰 선생님 칭찬 보너스</span><b>-' + BOSS_RULES.bonus + '</b></div>' +
          '<div style="font-size:12px;color:var(--ej-ink-soft);margin:6px 2px 14px">보스 체력은 우리 반 인원 × ' + BOSS_RULES.hpPer + ' (최소 ' + BOSS_RULES.hpMin + ')이에요. 매주 월요일에 새 보스가 나타나요.</div>';
        const top = Object.keys(b.by).map(function (n) { return { n: n, d: b.by[n] }; }).sort(function (x, y) { return y.d - x.d; });
        body += '<div class="ej-eyebrow" style="margin-bottom:6px">🔥 이번 주 우리 반 공격왕</div>';
        if (!top.length) body += '<div class="ej-card ej-empty" style="margin-bottom:12px">아직 아무도 공격하지 않았어요. 첫 공격의 주인공이 되어 보세요!</div>';
        top.slice(0, 8).forEach(function (r, i) {
          body += '<div class="g-row' + (r.n === STATE.studentName ? ' me' : '') + '"><span class="rk">' + (['🥇', '🥈', '🥉'][i] || (i + 1)) + '</span><span style="width:72px">' + esc(r.n) + '</span><span class="bar"><i style="width:' + Math.min(100, r.d / top[0].d * 100) + '%"></i></span><b>' + r.d + '</b></div>';
        });
        if (!b.by[STATE.studentName]) body += '<div style="font-size:13px;color:#B5423A;margin:6px 2px 0">아직 나는 공격하지 않았어요! 오늘 일지를 쓰면 바로 -10 💥</div>';
        // 반 대항
        const classes = allClassNames().filter(function (cl) { return classMembers_(cl).length > 0; });
        const rank = classes.map(function (cl) { const x = bossFor(cl); return { cl: cl, p: Math.min(100, Math.round(x.dmg / x.maxHp * 100)), win: x.defeated }; }).sort(function (x, y) { return y.p - x.p; });
        if (rank.length > 1) {
          body += '<div class="ej-eyebrow" style="margin:16px 0 6px">🏁 반 대항 순위 (보스 체력 깎은 비율)</div>';
          rank.forEach(function (r, i) { body += '<div class="g-row' + (r.cl === STATE.studentClass ? ' me' : '') + '"><span class="rk">' + (i + 1) + '</span><span style="width:84px">' + esc(r.cl) + '</span><span class="bar"><i style="width:' + r.p + '%"></i></span><b>' + (r.win ? '🏆' : r.p + '%') + '</b></div>'; });
        }
        return panelFrame('⚔️ 반 대항 보스전', body);
      }
      if (kind === 'friends') {
        const list = (STATE.classIslands || []).filter(function (i) { return String(i.studentNumber) !== String(STATE.studentNumber); })
          .sort(function (a, b) { return (a.studentNumber || 0) - (b.studentNumber || 0); });
        let body = '<div class="g-deco-help" style="margin-bottom:12px">🏝️ 같은 반 친구의 섬을 구경하고 👍 도장을 찍어 주세요. 한 친구 섬에 하루 한 번 찍을 수 있어요.</div>';
        if (!STATE.classIslandsAt) body += '<div class="ej-card ej-empty">친구 섬을 불러오는 중…</div>';
        else if (!list.length) body += '<div class="ej-card ej-empty">아직 섬을 만든 친구가 없어요.<br>친구들이 들어와서 동물 친구를 고르면 여기 나타나요!</div>';
        list.forEach(function (f) {
          const pts = studentTotalPoints(STATE.studentClass, f.studentName), st = stageIndexOf(pts), t = BADGE_TIERS[st];
          const sp = f.pet && PET_SPECIES[f.pet.species] ? PET_SPECIES[f.pet.species] : null;
          body += '<div class="g-friend"><div class="av">' + (st === 0 || !sp ? '🥚' : petEmoji(f.pet.species, st)) + '</div><div class="info"><div class="nm">' + (f.studentNumber ? f.studentNumber + '번 ' : '') + esc(f.studentName || '') + '</div>' +
            '<div class="sub">' + (sp ? esc(f.pet.name) + ' · ' : '') + t.emoji + ' ' + t.label + ' · 👍 ' + (f.likes || 0) + '</div></div>' +
            (sp ? '<button type="button" data-visit="' + f.studentNumber + '">놀러가기 ▶</button>' : '<span style="font-size:12px;color:var(--ej-ink-soft)">준비 중</span>') + '</div>';
        });
        const mine = (STATE.classIslands || []).find(function (i) { return String(i.studentNumber) === String(STATE.studentNumber); });
        body += '<div style="font-size:12.5px;color:var(--ej-ink-soft);margin-top:10px;text-align:center">내 섬이 받은 도장 👍 ' + ((mine && mine.likes) || 0) + '개</div>';
        return panelFrame('🏝️ 친구 섬 놀러가기', body);
      }
      if (kind === 'decorate') {
        let inv = '<div class="g-props">';
        PROP_CATALOG.forEach(function (p) {
          const locked = c.stage < p.stage;
          const used = WORLD.propCount ? WORLD.propCount(p.type) : 0;
          inv += '<button type="button" class="g-prop' + (locked ? ' lock' : '') + (used >= p.max ? ' full' : '') + '" data-prop="' + p.type + '"' + (locked ? ' disabled' : '') + '>' +
            '<span class="e">' + (locked ? '🔒' : p.emoji) + '</span><span class="n">' + p.name + '</span>' +
            '<span class="c">' + (locked ? BADGE_TIERS[p.stage].emoji + ' ' + BADGE_TIERS[p.stage].label + ' 단계' : used + ' / ' + p.max) + '</span></button>';
        });
        inv += '</div>';
        const unlocked = PROP_CATALOG.filter(function (p) { return c.stage >= p.stage; }).length;
        return panelFrame('🛠️ 섬 꾸미기',
          '<div class="g-deco-help">✋ 사물을 끌어서 옮겨요 · <b>R</b> 또는 ↻ 로 돌리기<br>빨간 표시가 뜨는 곳(겹치는 곳·섬 밖)에는 놓을 수 없어요.</div>' +
          '<div id="g-deco-sel" class="g-deco-sel">사물을 눌러서 골라 보세요</div>' +
          '<div class="ej-eyebrow" style="margin:14px 0 6px">🎁 꾸미기 소품 · ' + unlocked + ' / ' + PROP_CATALOG.length + ' 열림</div>' + inv +
          (unlocked < PROP_CATALOG.length ? '<div style="font-size:12.5px;color:var(--ej-ink-soft);margin-top:8px">친구가 진화할 때마다 새 소품이 열려요!</div>' : '') +
          '<div class="g-big-btns" style="margin-top:14px"><button type="button" class="ej-btn ej-btn-primary" id="g-deco-save">💾 저장</button>' +
          '<button type="button" class="ej-btn ej-btn-ghost" id="g-deco-cancel">취소</button><button type="button" class="ej-btn ej-btn-ghost" id="g-deco-reset">↺ 처음 배치로</button></div>');
      }
      if (kind === 'adopt') {
        const saved = loadPet(STATE.studentClass, STATE.studentNumber);
        const sel = STATE.adoptSel || (saved ? saved.species : null);
        let grid = '<div class="g-species">';
        PET_SPECIES_ORDER.forEach(function (k) { grid += '<button type="button" data-species="' + k + '" class="' + (sel === k ? 'sel' : '') + '"><span class="e">' + PET_SPECIES[k].emoji + '</span>' + PET_SPECIES[k].name + '</button>'; });
        grid += '</div>';
        return panelFrame(saved ? '✏️ 내 친구 바꾸기' : '🌱 함께 자랄 친구 고르기',
          '<p style="margin:0 0 4px;color:var(--ej-ink-soft);font-size:14px;line-height:1.6">' + (saved ? '종류와 이름을 바꿀 수 있어요. 포인트와 성장 단계는 그대로예요.' : '일지를 쓰고 포인트를 모으면 알에서 깨어나 쑥쑥 자라고 진화해요! 동물을 누르면 섬에서 미리 볼 수 있어요.') + (c.stage === 0 ? '<br><span style="color:#3F8A33">👀 섬에 보이는 건 알에서 깨어나 조금 자란 모습이에요.</span>' : '') + '</p>' +
          grid +
          '<div class="ej-field"><div class="ej-field-label">이름 (최대 8자)</div><input id="g-pet-name" class="ej-input" maxlength="8" placeholder="' + (sel ? PET_SPECIES[sel].suggest : '이름') + '" value="' + (saved ? esc(saved.name) : '') + '"></div>' +
          '<div class="g-big-btns"><button type="button" class="ej-btn ej-btn-primary" id="g-adopt-go"' + (sel ? '' : ' disabled') + '>' + (saved ? '바꾸기' : '이 친구로 할래요! ▶') + '</button>' +
          (saved ? '<button type="button" class="ej-btn ej-btn-ghost" id="g-panel-cancel">취소</button>' : '') + '</div>');
      }
      return '';
    }

    function openGamePanel(kind) {
      STATE.studentPanel = kind;
      if (window.innerWidth < 720) STATE.menuOpen = false;
      render();
    }
    function closeGamePanel() {
      if (STATE.studentPanel === 'adopt' && !loadPet(STATE.studentClass, STATE.studentNumber)) return;
      STATE.studentPanel = null; STATE.adoptSel = null; STATE.showEntryForm = false;
      render();
    }

    function openDecorate() {
      if (!WORLD.ready) { alert('이 기기에서는 3D 섬을 불러오지 못해서 꾸미기를 할 수 없어요.'); return; }
      try { localStorage.setItem(decoSeenKey_(), String(stageIndexOf(studentTotalPoints(STATE.studentClass, STATE.studentName)))); } catch (e) { }
      openGamePanel('decorate');
    }
    function updateDecoSel(info) {
      const el = document.getElementById('g-deco-sel'); if (!el) return;
      if (!info) { el.innerHTML = '사물을 눌러서 골라 보세요'; return; }
      let name = OBJECT_NAMES[info.id] || '';
      if (info.kind === 'prop') { const p = PROP_CATALOG.find(function (q) { return q.type === info.type; }); name = p ? p.emoji + ' ' + p.name : info.type; }
      el.innerHTML = '<b>' + esc(name) + '</b><span class="g-deco-actions"><button type="button" id="g-deco-rot">↻ 돌리기</button>' +
        (info.kind === 'prop' ? '<button type="button" id="g-deco-del">🗑️ 넣기</button>' : '') + '</span>';
      byId('g-deco-rot', function (b) { b.onclick = function () { WORLD.editRotate(); }; });
      byId('g-deco-del', function (b) { b.onclick = function () { WORLD.editRemove(); render(); }; });
    }
    function decoToast(msg) {
      let t = document.getElementById('g-deco-toast');
      if (!t) { t = document.createElement('div'); t.id = 'g-deco-toast'; t.className = 'g-deco-toast'; document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2200);
    }
    WORLD.onEditSelect = updateDecoSel;
    WORLD.onEditBlocked = function (why) { decoToast(why === 'rotate' ? '그 방향은 앞이 막혀서 돌릴 수 없어요' : '거기는 겹치거나 다른 사물 앞을 막아서 놓을 수 없어요'); };

    // 사물(또는 메뉴) → 기능 열기
    function onWorldObject(key) {
      if (STATE.screen !== 'studentHome' || STATE.visit) return;
      if (STATE.studentPanel === 'adopt') return;
      if (PANEL_OF[key]) { openGamePanel(PANEL_OF[key]); return; }
      if (STATE.studentPanel) { STATE.studentPanel = null; render(); }
      if (key === 'mailbox') { STATE.studentMailError = ''; openMailboxModal(); }
      else if (key === 'board') openStudyRoomModal();
      else if (key === 'shelf') openDictionaryModal();
      else if (key === 'jar') openWordCollectorModal();
      else if (key === 'arcade') openWordGameModal();
    }
    function menuGo(key) {
      if (key === 'pet') { openGamePanel('pet'); return; }
      if (key === 'decorate') { openDecorate(); return; }
      if (key === 'boss') { openGamePanel('boss'); return; }
      if (key === 'friends') { openGamePanel('friends'); loadClassIslands(); return; }
      if (WORLD.ready) WORLD.activate(key, true); else onWorldObject(key);
    }

    function bindGame() {
      byId('g-demo-reset', function (el) { el.onclick = function () { if (confirm('체험 데이터를 처음 상태로 되돌릴까요?')) demoReset(); }; });
      byId('g-player', function (el) { el.onclick = function () { openGamePanel('pet'); }; });
      document.querySelectorAll('[data-go]').forEach(function (el) { el.onclick = function () { menuGo(el.getAttribute('data-go')); }; });
      byId('g-menu-toggle', function (el) { el.onclick = function () { STATE.menuOpen = !STATE.menuOpen; render(); }; });
      byId('g-panel-close', function (el) { el.onclick = closeGamePanel; });
      byId('g-panel-cancel', function (el) { el.onclick = function () { STATE.studentPanel = STATE.studentPanel === 'adopt' ? 'pet' : null; STATE.adoptSel = null; render(); }; });
      document.querySelectorAll('[data-prop]').forEach(function (el) {
        el.onclick = function () {
          const type = el.getAttribute('data-prop'); const p = PROP_CATALOG.find(function (q) { return q.type === type; });
          if (!p || el.disabled) return;
          if (WORLD.propCount(type) >= p.max) { decoToast(p.name + '은(는) ' + p.max + '개까지 놓을 수 있어요'); return; }
          if (!WORLD.addProp(type)) { decoToast('빈자리가 없어요. 다른 사물을 옮겨 보세요'); return; }
          render();
        };
      });
      byId('g-deco-save', function (el) { el.onclick = function () { const L = WORLD.stopEdit(true); if (L) saveIslandLayout(L); STATE.studentPanel = null; render(); decoToast('내 섬 배치를 저장했어요 ✨'); setTimeout(function () { WORLD.say('우와, 섬이 새로워졌다! 🌷', 2800); }, 400); }; });
      byId('g-deco-cancel', function (el) { el.onclick = function () { STATE.studentPanel = null; render(); }; });
      byId('g-deco-reset', function (el) { el.onclick = function () { WORLD.resetLayoutInEdit(); render(); decoToast('처음 배치로 돌려 놨어요. 저장을 눌러야 적용돼요'); }; });
      if (STATE.studentPanel === 'decorate' && WORLD.ready && WORLD.isEditing()) { /* 선택 상태 유지 */ }
      byId('g-bossbar', function (el) { el.onclick = function () { openGamePanel('boss'); }; });
      byId('g-quiz-open', function (el) { el.onclick = openBossQuiz; });
      document.querySelectorAll('[data-visit]').forEach(function (el) {
        el.onclick = function () {
          const num = el.getAttribute('data-visit');
          const f = (STATE.classIslands || []).find(function (i) { return String(i.studentNumber) === String(num); });
          if (!f || !f.pet) return;
          const pts = studentTotalPoints(STATE.studentClass, f.studentName);
          STATE.visit = { key: STATE.studentClass + '|' + num + '|' + Date.now(), num: f.studentNumber, ownerName: f.studentName, petName: f.pet.name, species: f.pet.species, stage: stageIndexOf(pts), layout: f.layout, likes: f.likes || 0, liked: false };
          STATE.studentPanel = null; render();
        };
      });
      byId('g-visit-home', function (el) { el.onclick = function () { STATE.visit = null; STATE.studentPanel = 'friends'; render(); loadClassIslands(); }; });
      byId('g-visit-like', function (el) {
        el.onclick = function () {
          const v = STATE.visit; if (!v || v.liked) return;
          el.disabled = true;
          gsRun('likeIsland', STATE.studentClass, v.num, STATE.studentNumber).then(function (r) {
            v.liked = true; v.likes = r.likes;
            const f = (STATE.classIslands || []).find(function (i) { return String(i.studentNumber) === String(v.num); }); if (f) f.likes = r.likes;
            render(); WORLD.pokePet();
            decoToast(r.already ? '오늘은 이미 도장을 찍었어요' : '👍 도장 쾅! ' + v.ownerName + '에게 전해졌어요');
          }).catch(function (e) { el.disabled = false; decoToast((e && e.message) || '도장을 찍지 못했어요'); });
        };
      });
      byId('g-boss-reward', function (el) { el.onclick = function () { giveBossReward(el.getAttribute('data-class')); }; });
      byId('g-pet-poke', function (el) { el.onclick = function () { WORLD.pokePet(); }; });
      byId('g-pet-edit', function (el) { el.onclick = function () { STATE.adoptSel = null; openGamePanel('adopt'); }; });
      document.querySelectorAll('[data-species]').forEach(function (el) {
        el.onclick = function () {
          const typed = (document.getElementById('g-pet-name') || {}).value || '';
          STATE.adoptSel = el.getAttribute('data-species'); render();
          const n = document.getElementById('g-pet-name'); if (n) { n.value = typed; }
          WORLD.pokePet();
        };
      });
      byId('g-adopt-go', function (el) {
        el.onclick = function () {
          const saved = loadPet(STATE.studentClass, STATE.studentNumber);
          const sp = STATE.adoptSel || (saved && saved.species); if (!sp) return;
          const name = ((document.getElementById('g-pet-name') || {}).value || '').trim().slice(0, 8) || PET_SPECIES[sp].suggest;
          const newPet = { species: sp, name: name, adoptedAt: (saved && saved.adoptedAt) || Date.now() };
          savePet(STATE.studentClass, STATE.studentNumber, newPet);
          gsRun('saveIslandPet', STATE.studentClass, STATE.studentNumber, STATE.studentName, JSON.stringify(newPet)).catch(function () { });

    function quizPool_() {
      const seen = {}, pool = [];
      const add = function (w, m) {
        w = String(w || '').trim(); m = String(m || '').trim();
        if (!w || !m || seen[w.toLowerCase()]) return;
        seen[w.toLowerCase()] = true; pool.push({ word: w, meaning: m });
      };
      // 내가 모은 단어 → 우리 반이 모은 단어 → 기본 단어 순서로 섞어요
      const mine = (STATE.words || []).filter(function (w) { return w.className === STATE.studentClass && String(w.studentNumber) === String(STATE.studentNumber); });
      const cls = (STATE.words || []).filter(function (w) { return w.className === STATE.studentClass; });
      demoShuffle(mine).forEach(function (w) { add(w.word, w.meaning); });
      demoShuffle(cls).forEach(function (w) { add(w.word, w.meaning); });
      demoShuffle(QUIZ_BANK).forEach(function (b) { add(b[0], b[1]); });
      return pool;
    }
    function quizNext_() {

      const others = demoShuffle(q.pool.filter(function (p) { return p.word !== item.word; })).slice(0, 3);
      const choices = demoShuffle([item].concat(others));
      q.cur = { item: item, reverse: reverse, choices: choices, answered: false };

      const head = '<div class="g-quiz-head"><span>' + b.emoji + ' ' + esc(b.name) + '와(과) 단어 대결!</span>' + (q.phase !== 'play' ? '<button type="button" class="g-quiz-x" id="g-quiz-x">✕</button>' : '') + '</div>';

        });

          (q.phase === 'saving' ? '<p>공격 기록을 저장하는 중…</p>' : (q.error ? '<div class="ej-error">' + esc(q.error) + '</div>' : '<p>' + (r && r.defeated ? '🎉 <b>보스를 쓰러뜨렸어요!</b> 우리 반 최고!' : '우리 반 보스 체력이 <b>' + (r ? r.hp : '') + '</b> 남았어요. 내일 또 도전해요!') + '</p>')) +

    function startQuiz() {

    function answerQuiz(i) {
      const q = QUIZ; if (!q || q.phase !== 'play' || q.cur.answered) return;
      const c = q.cur, ok = c.choices[i] && c.choices[i].word === c.item.word;

          WORLD.say(q.dmg > 0 ? '나이스! -' + q.dmg + ' 데미지 💥' : '아깝다… 내일 다시 붙자!', 2600);
        }
      }).catch(function (e) {
        q.error = (e && e.message) || '기록을 저장하지 못했어요.';
        q.phase = 'done'; paintQuiz();
      });
    }
    document.addEventListener('keydown', function (ev) {
      if (!QUIZ) return;
      // 대결 창이 열려 있는 동안에는 섬(방향키·Space/Enter)으로 키가 넘어가지 않게 막아요
      if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA')) return;
      ev.stopPropagation();
      if (QUIZ.phase === 'play' && /^[1-4]$/.test(ev.key)) { ev.preventDefault(); answerQuiz(Number(ev.key) - 1); }
      else if (QUIZ.phase === 'ready' && ev.key === 'Enter') { ev.preventDefault(); startQuiz(); }
      else if (QUIZ.phase === 'done' && (ev.key === 'Enter' || ev.key === 'Escape')) { ev.preventDefault(); closeQuiz(); }
      else if (QUIZ.phase === 'ready' && ev.key === 'Escape') { ev.preventDefault(); closeQuiz(); }
    }, true);
    window.addEventListener('keyup', function (ev) { if (QUIZ) ev.stopPropagation(); }, true);

    render();
    gsRun('getAllData').then(function (data) {
      STATE.entries = data.entries || [];
      STATE.classes = data.classes || [];
      STATE.mails = data.mails || [];
      STATE.mailReplies = data.mailReplies || [];
      STATE.words = data.words || [];
      STATE.bonuses = data.bonuses || [];
      STATE.studyLinks = data.studyLinks || [];
      STATE.loading = false;

      const session = loadSession();
      if (session && session.className && session.studentName && session.studentNumber != null) {
        STATE.studentClass = session.className;
        STATE.studentName = session.studentName;
        STATE.studentNumber = session.studentNumber;
        computeNewFeedback(session.className, session.studentName, session.studentNumber);
        STATE.calendarSelectedDate = null;
        STATE.calendarYear = new Date().getFullYear();
        STATE.calendarMonth = new Date().getMonth();
        checkTierUpAndCelebrate(
          session.className, session.studentNumber,
          studentTotalPoints(session.className, session.studentName)
        );
        STATE.screen = 'studentHome';
      }

      render();
    }).catch(function () {
      STATE.loading = false;
      STATE.saveError = '데이터를 불러오지 못했어요. 새로고침 해주세요.';
      render();
    });
  </script>
</body>
</html>
